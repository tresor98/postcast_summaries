<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0F0F0F;
      --surface: #181818;
      --surface2: #222222;
      --border: #2A2A2A;
      --text: #F0EDE6;
      --muted: #888880;
      --accent: #E8A838;
      --accent-dim: rgba(232, 168, 56, 0.12);
      --pill-m-bg: rgba(99, 130, 255, 0.15);
      --pill-m-text: #8FA8FF;
      --pill-i-bg: rgba(72, 199, 142, 0.15);
      --pill-i-text: #5ECFA0;
      --pill-w-bg: rgba(232, 168, 56, 0.15);
      --pill-w-text: #E8A838;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 48px 40px 36px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .header-left h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: var(--text);
    }

    .header-left h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .header-left p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 300;
    }

    /* signal wave SVG mark */
    .signal-mark {
      flex-shrink: 0;
      opacity: 0.35;
    }

    /* ── GRID ── */
    main {
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover {
      border-color: #3A3A3A;
      background: var(--surface2);
      transform: translateY(-2px);
    }

    .card:hover::before { opacity: 1; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-ep {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .card-date {
      font-size: 11px;
      color: var(--muted);
    }

    .card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text);
    }

    .card-guest {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .card-guest strong {
      color: #B0ADA6;
      font-weight: 500;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .pill-m { background: var(--pill-m-bg); color: var(--pill-m-text); }
    .pill-i { background: var(--pill-i-bg); color: var(--pill-i-text); }
    .pill-w { background: var(--pill-w-bg); color: var(--pill-w-text); }

    .card-preview {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-count {
      font-size: 11px;
      color: var(--muted);
    }

    .card-arrow {
      font-size: 16px;
      color: var(--accent);
      transition: transform 0.2s;
    }
    .card:hover .card-arrow { transform: translateX(4px); }

    /* ── MODAL OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      overflow: hidden;
      transform: translateY(16px);
      transition: transform 0.25s;
    }

    .overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 32px 36px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-header-left { flex: 1; }

    .modal-ep {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 400;
      line-height: 1.2;
      color: var(--text);
    }

    .modal-guest {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .modal-guest strong { color: #B0ADA6; font-weight: 500; }

    .close-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
      line-height: 1;
    }
    .close-btn:hover { color: var(--text); border-color: #444; }

    .modal-body {
      padding: 32px 36px 40px;
    }

    /* ── SUMMARY TABLE ── */
    .summary-section {
      margin-bottom: 36px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 180px 80px 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 13px 0;
      align-items: start;
    }

    @media (max-width: 600px) {
      .summary-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    .row-topic {
      font-size: 13px;
      font-weight: 500;
      color: #B0ADA6;
      padding-right: 16px;
    }

    .row-type {
      padding-right: 12px;
    }

    .row-insight {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }

    /* ── EMPTY STATE ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
    }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding: 14px 18px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px 40px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

          { topic: "Sales is a process, not an event", type: "m", insight: "The swipe of the credit card is the beginning, not the end. The sale continues every time your face appears — you're selling them on the next step, on showing up, on getting the value they paid for. If people aren't using what they bought, you're not selling them on it. Never not selling." },
          { topic: "Sell every component like it's the whole price", type: "i", insight: "If your program costs $25,000 and includes an event, sell the event as if the event alone is worth $25,000. Whatever energy you bring to something is the energy others receive it with. You don't get what you want — you get who you are." },
          { topic: "Persuasion is a place you operate from", type: "m", insight: "Most people learn sales only inside their specific context — so they think of it as a task. That's not sales. Sales is a place you operate from in every conversation, every day, with everyone. Learn it on purpose, outside your business context, and then it transfers everywhere." },
        ]
      },
      {
        label: "The Emotion You're Trying to Create",
        rows: [
          { topic: "Not excitement — empowerment", type: "m", insight: "The goal is not to get someone excited. Excited is 'this will be easy, just press the button.' Empowered is 'this will be challenging and I know I can do it.' Easy-button selling creates disappointed customers who quit at the first inconvenience. Empowered customers show up and push through." },
          { topic: "Empowerment requires edge, not comfort", type: "m", insight: "Macy's father pushed her to do a live event 37 weeks pregnant, living out of her parents' home, house falling apart. She was furious. But when she finished, she felt empowered — confident, capable, made for this. She didn't feel that during. Empowerment arrives after the edge, not before it. How someone gets sold affects how they show up." },
          { topic: "Anticipation beats excitement", type: "m", insight: "The target emotional state is anticipation — the belief that a positive outcome is on the other side, paired with a willingness to work for it. 'This is going to be challenging and I'm excited about the challenge.' That's the state that produces committed customers who stay, do the work, and get results." },
        ]
      },
      {
        label: "Certainty Is the Only Thing That Sells",
        rows: [
          { topic: "Certainty beats tone, script, and style", type: "m", insight: "There are four types of buyers — some need logic, some emotion, some speed, some nurturing. The style varies. What never varies is that what actually sells is certainty. A look in your eye that says: I care about you, I want you to win, and I have no doubt this is the right thing. That comes through in any tone, at any pace." },
          { topic: "Your mouth is the faucet, your state is the water tank", type: "m", insight: "People obsess over the sentences. But sentences come from state. If you're nervous, fearful, doubtful, or unsure — that will come out no matter what words you say. You can't have the right state without the experience that builds it. Go on an investment journey. Feel the pain and the payoff. Then you can speak to both with conviction." },
          { topic: "Sell every day to build certainty", type: "i", insight: "Certainty comes from volume. Sell every day. Sell an idea. Sell your kid on broccoli. Sell a belief. Sell the salsa. The more you sell, the more certain you become. The more certain you are, the more you sell. Selling is the prerequisite to certainty — not the other way around." },
          { topic: "Think about them, not yourself", type: "i", insight: "When you start thinking about what to say, how you're coming across, what your tone is — you crash and burn. When you're obsessed with: how do I help you win? What thought is in your way? How do I meet you where you are? — you come off exactly right. The shift from self-focus to other-focus is not a technique. It's the whole game." },
        ]
      },
      {
        label: "Objections and the Bridge Framework",
        rows: [
          { topic: "Objections are planted by your language", type: "w", insight: "Almost always, when you keep hearing the same objection, you planted it. The language you're using, the operating system driving that language — it's showing up in what they say back to you. Before trying to handle an objection, look at yourself. What are you saying that's creating it?" },
          { topic: "Sales is a bridge, thought by thought", type: "m", insight: "Sales is a bridge from where someone is to where they want to be. You walk them across it one thought at a time. The mistake is driving hard toward the outcome without addressing the thought that's blocking them right now. If someone feels vulnerable in group coaching, they need to believe it's safe before they can ever consider the outcome. Meet them at the current thought first." },
          { topic: "What's in the way, not the outcome", type: "i", insight: "People don't fail to buy because of the outcome. They fail because something is in the way of the outcome. Your job is to identify and remove that thing — one specific belief, one specific fear, one specific story. You can't put new beliefs on top of old ones. Clear the old one first." },
          { topic: "Replace the story, don't take it", type: "i", insight: "You can't take candy from a baby without giving them something else to grab onto first. Same with beliefs. You have to offer a better story so compelling that they're willing to release the old one. This is why you're always on a story hunt — looking for a story that attaches to a belief that moves someone forward." },
          { topic: "Know 100x more than you'll ever say", type: "m", insight: "Think about sales like a court case. Every juror has to be unanimous: 'Yes, she's the best' — through evidence, not assertion. You have to know a hundred times more than you'll ever say, so you can say exactly the right thing at exactly the right time for exactly this person. That's only possible if you're focused on them, not your script." },
        ]
      },
      {
        label: "Handling Desperation and the Yips",
        rows: [
          { topic: "Desperation = misdirected focus", type: "m", insight: "Desperation in sales is the same as 'the yips' in sports — pitchers throwing into the stands, penalty kickers airballing a shot they've made a thousand times. It's not a disease. It's misdirected focus on the outcome instead of the process. The fix: get back to the skill. Back to the process. Back to them." },
          { topic: "The skill carries you through chaos", type: "m", insight: "Macy's hardest year involved a falling-apart house, being 37 weeks pregnant, a partner leaving, giving birth — all at once. Not only did the business not fall apart, it grew. The skill carries you. If you know how to focus on the payoff, on what someone gets, on meeting them where they are — your personal circumstances can't stop you." },
          { topic: "Don't watch the scoreboard", type: "i", insight: "When starting out: don't look at the numbers. Just sell every day for six months. Get into conversations, focus on the process, enjoy the game. The scoreboard takes care of itself when you stop watching it. When you start watching it, the yips start." },
        ]
      },
      {
        label: "One-to-One to One-to-Many",
        rows: [
          { topic: "Individual conversations build your presentation", type: "i", insight: "Every one-on-one conversation is market research for your one-to-many content. A dietitian got the objection 'there's so much free stuff on YouTube, why pay?' She turned that single objection into daily podcasts, emails, and Instagram stories from every angle — and had an $80,000 week. One conversation. Used everywhere." },
          { topic: "DMs are gold", type: "i", insight: "Every word someone says in a DM is exactly what you should be saying in your one-to-many. Their exact language, their exact objection, their exact fear — use it verbatim. The closer your one-to-many mirrors the actual thoughts of one real person, the more your whole audience feels you're speaking directly to them." },
          { topic: "Apply outcomes to their specific future", type: "i", insight: "Don't sell '10x your income' as an abstract outcome. Apply it to someone's specific, concrete, imaginable future. The more specific, the more universal — even if someone isn't a parent, they had a mom. A specific future is more persuasive than a generic outcome because people can see it. If they can't picture it, it's not persuasive." },
        ]
      },
      {
        label: "Congruence: How You Show Up",
        rows: [
          { topic: "Work with human nature, not against it", type: "m", insight: "People judge by appearance — that's human nature, not a flaw. Their eyes help them know what's safe and what to move toward. You can fight it and lose, or work with it. Color, energy, vitality — everything about how you physically show up either pulls people toward you or doesn't. Choose to make it pull." },
          { topic: "Be a representation of what you sell", type: "i", insight: "If you sell transformation, look transformed. If you sell energy and vitality, look full of life. Congruence between what you're selling and how you embody it isn't superficial — it's the most credible proof you have. Your wardrobe, your skin, your energy, your presence: all of it is either consistent with your offer or it undercuts it." },
          { topic: "Wardrobe is a hidden form of transformation", type: "i", insight: "Most people have clothes they wear when they feel bad — to stay in that feeling. Your wardrobe can either keep you in homeostasis (familiar hell) or move you toward who you're becoming. Get rid of the clothes that represent a version of yourself you're done with. You eat differently, show up differently, create differently based on how you're dressed." },
          { topic: "Be ready for every opportunity", type: "m", insight: "You don't become this person until you get the sales bug — where everything matters, every conversation is an opportunity. You're one conversation away, at the grocery store, anywhere. But you can't see those opportunities if you're not ready for them. Be ready all the time." },
        ]
      },
      {
        label: "The Language of Sales",
        rows: [
          { topic: "Never say 'I' in a sales conversation", type: "i", insight: "Every time you say 'I will do this for you,' people's brains go passive. The moment you say 'you will get,' they wake up — because it triggers the only question they're always asking: what's in it for me? Overcorrect until 'you' is your natural default. 'You will get five posts a week so that you can stay in your zone of genius' lands differently than 'I will post five times a week.'" },
          { topic: "Ask 'why,' not 'what'", type: "i", insight: "When asking someone about what they do, don't ask 'what do you do?' — that gets tactics and logistics. Ask 'tell me the story of why you do what you do.' Story unlocks the subconscious, creates emotion, and everything emotional they say becomes the raw material you use to sell back to them. Tactics give you facts. Stories give you fuel." },
          { topic: "Curiosity and judgment can't coexist", type: "m", insight: "When you're in genuine curiosity — you actually want to know where they are to meet them there — it's almost impossible to come off wrong. The problem is most people ask questions from a place of judgment (finding the angle to overcome) rather than curiosity (trying to understand). The state you're in determines the state they land in." },
          { topic: "You can't have the words without the experience", type: "w", insight: "You can learn every objection-handling script ever written, but if you haven't been through the inconveniences yourself, you won't be able to talk someone through them. The words come from the state. The state comes from the experience. There's no shortcut. Invest in things that stretch you. Feel the pain and the payoff. Then you can sell both." },
        ]
      },
    ]
  },
  {
    id: "myron-golden-ai",
    episode: "Ep. 003",
    date: "July 2025",
    title: "How to Outperform Everyone Else Using AI",
    guest: "Myron Golden & Miguel Carrasco",
    guestTitle: "Serial Entrepreneur & AI Consultant",
    preview: "AI is a multiplier, not a magic bullet. Multiply zero by any model and you still get zero. Myron Golden breaks down the 12 levels of human creativity AI can't replicate, the 7 levels of AI mastery, and the four levels of teaching that determine whether any knowledge actually changes someone.",
    tags: ["Mindset", "Ideas", "Warning"],
    rowCount: 42,
    sections: [
      {
        label: "The Core AI Mindset: Multiplication, Not Magic",
        rows: [
          { topic: "AI multiplies what you already are", type: "m", insight: "AI is not a magic bullet. It's a multiplier. If you multiply any number by zero, the result is zero — no matter how powerful the AI. If you multiply by one, you stay exactly where you are. The only way AI makes you more valuable is if you are already a number greater than one. Your job is to become worth multiplying first." },
          { topic: "AI increases productivity, not value", type: "m", insight: "AI doesn't add value to you — it increases the rate at which you can deliver the value you already have into the marketplace. The distinction matters: chasing AI tools without building underlying competence is a dead end. Build the human first, then use AI as the exponent." },
          { topic: "The model doesn't matter", type: "m", insight: "The release of a new model from Anthropic, OpenAI, Google, or DeepSeek changes nothing for most people. The model can only multiply what you already are. A more powerful multiplier applied to a zero is still zero. Stop waiting for the next model and start becoming someone worth multiplying." },
          { topic: "Humans using AI will outperform you", type: "w", insight: "AI is not going to take your job. Humans who learn to use AI effectively will. Companies who learn to use AI effectively will take your customers. This is not a technology story — it's a human evolution story. The same pattern played out with the web, social media, Facebook ads, and Bitcoin. You're at the crossroads now." },
          { topic: "AI is as bad as it will ever be today", type: "m", insight: "Every week it gets better, every month better still. The people who learn how to use it now, while most others are still dismissing or fearing it, are buying the equivalent of Bitcoin at 50 cents. In five years, the foundation will be table stakes. The compounding advantage belongs to those who start now." },
        ]
      },
      {
        label: "The Four Levels of Teaching (and Learning)",
        rows: [
          { topic: "Level 1: Tactics", type: "m", insight: "Tactics answer 'what do I do?' They are a trap for both teacher and student. People who don't get in shape aren't lacking tactics — eat less, move more is four words. People don't do what they know. Teaching only tactics produces students who leave knowing what to do and still don't do it." },
          { topic: "Level 2: Strategies", type: "m", insight: "Strategies add timing and motivation to tactics. But knowing what to do, when to do it, and why to do it still doesn't produce transformation. You can be strategically informed and behaviourally unchanged. Most coaching sits here and wonders why clients don't change." },
          { topic: "Level 3: Principles", type: "m", insight: "Principles are the laws that govern how something works. Teaching at this level means showing people how to do something, grounded in why it actually works that way. Students at this level have more success because they can adapt the method — not just follow instructions." },
          { topic: "Level 4: Essence", type: "m", insight: "The highest level of teaching is essence: teaching people how to become the kind of person who will naturally do the thing. This is identity-level change. Most transformation fails because it targets behaviour without touching identity. If you can teach at this level, people don't need willpower — the behaviour becomes natural to who they are." },
          { topic: "The best teachers hit all four levels", type: "i", insight: "The reason some teachers are impossible to stop listening to is they speak to all four levels simultaneously — no matter where you are in your journey, something lands. Applying this to AI: the better you operate at levels 3 and 4, the richer your prompts and the more you'll extract from any AI tool." },
        ]
      },
      {
        label: "Entrepreneurial Identity: The Foundation",
        rows: [
          { topic: "Be yourself in the marketplace", type: "m", insight: "The highest-performing version of your work comes from operating from your own unique identity. Michael Jackson never tried to be the Beatles. Beyonce is not trying to be Alicia Keys. The people you're meant to serve can only be served by the specific version of you that actually exists. Stop going to market trying to be someone else." },
          { topic: "Integrity: don't lie to get paid", type: "m", insight: "A life built on nothing to hide, nothing to prove, nothing to lose is powerful for a practical reason: you don't need a good memory. You said the same thing last time because you told the truth last time. Manipulation with falsehood never ends well — the compounding damage is always worse than the short-term gain." },
          { topic: "Good intentions as a default", type: "m", insight: "If you showed up as yourself, always told the truth, and genuinely intended to do people good — everything in your life would change. Not as a strategy, but as a way of being. The combination of authentic identity, integrity, and good intentions is the foundation beneath everything else." },
        ]
      },
      {
        label: "The 12 Levels of Human Creativity (What AI Cannot Replicate)",
        rows: [
          { topic: "AI cannot create — only amplify", type: "m", insight: "AI can amplify, multiply, and simplify what you create. It cannot create on its own because it has no experiences, no purpose, no intention, and no identity. The 12 levels of human creativity are precisely what AI cannot replicate — and the more of them you apply to your use of AI, the more valuable your output becomes." },
          { topic: "1. Intention", type: "i", insight: "Every creative act begins with intention — purpose and objective. Before you use AI for anything, know what you want to create, why you're creating it, and what outcome you want. Without this, you're handing a powerful tool to someone with nothing to say." },
          { topic: "1B. Disruption follows intention", type: "m", insight: "Every time you decide to do something good, something difficult shows up first. If you don't know this in advance, disruption will deceive you into thinking you're on the wrong track. You're not. Stop labelling difficulty as bad — you don't know if something is bad until the whole situation is fully played out." },
          { topic: "2. Inspiration", type: "m", insight: "After disruption follows intention, you need something that makes you feel like doing the thing anyway. Inspiration is what moves you to action despite the disruption. Different things inspire different people — find yours and use it deliberately rather than waiting for motivation to show up uninvited." },
          { topic: "3. Illumination", type: "i", insight: "Illumination is learning. Confusion is a form of darkness. Every truth you learn that's new to you provides more light than you had before. There should almost never be a day where you are not reading, listening, or learning something that serves your purpose." },
          { topic: "4. Identification", type: "i", insight: "When you have a breakthrough idea, give it a name — now it has a handle. Naming your frameworks and concepts is not branding fluff; it's how ideas become transmissible and how thinking becomes teachable." },
          { topic: "5. Separation / Distinction", type: "i", insight: "When you introduce a word or concept that has more than one meaning, you must create distinction. Everyone shares the same vocabulary but not the same dictionary. This is especially critical when prompting AI — a vague input produces a vague output. Define your terms precisely." },
          { topic: "6. Segmentation", type: "i", insight: "Never work on all phases of a project simultaneously. Work on one thing that produces profit until it's done, then move to the next. If you have seven deliverables and work on them all at once, you make no money until month seven. Ship sequentially: start earning in month one and have multiple revenue streams by month seven." },
          { topic: "7. Systemisation", type: "i", insight: "Build something once that you can push a button on and it runs from now on. YouTube is systemisation — you create a video once and it generates income indefinitely. The goal is to identify which activities can be converted into systems that keep working without repeating the work." },
          { topic: "8. Delegation", type: "i", insight: "Before AI, delegation could only go to humans. Now it can go to AI. But if you've never practised delegating to humans, you won't be good at delegating to AI — it's the same skill. A vague instruction to a human produces poor results. A vague prompt to Claude or ChatGPT produces the same." },
          { topic: "9. Automation", type: "i", insight: "Automation is when AI does something automatically based on a trigger — no repeated instruction needed. Key distinction: delegation is you telling it each time; automation is it running on its own. Example: AI that checks your email hourly, summarises it, drafts responses, and places them in your drafts folder — set once, runs forever." },
          { topic: "10. Culmination", type: "m", insight: "Culmination is the marquee creation — the big thing everything else was building toward. Once you have the nine prior levels in place, you have the foundation to create something genuinely significant. Everything prior was scaffolding for this." },
          { topic: "11 & 12. Recognition and Relaxation", type: "m", insight: "After culmination comes recognition — pausing to acknowledge what you've built. Then relaxation — intentional rest is part of the creative cycle, not a reward for finishing. Sustainable creativity requires recovery baked into the process, not bolted on after burnout." },
        ]
      },
      {
        label: "The Seven Levels of AI Mastery",
        rows: [
          { topic: "Level 1: Anticipation AI", type: "m", insight: "This is how AI actually works at its core — predicting the next word, just like autocorrect on your phone. Understanding this demystifies AI entirely. It's not magic; it's pattern prediction at scale. This changes how you think about prompting — you're not asking a brain, you're steering a prediction engine." },
          { topic: "Level 2: Asking and answering", type: "w", insight: "Where 90% of people are: using AI like a search engine. This level will not make you money in any meaningful way. Most people who say 'AI doesn't work for me' are operating here and have never gone deeper." },
          { topic: "Level 3: Automations", type: "i", insight: "Setting up AI to automatically do something without repeated instruction. This is where you start getting real time back. Triggered workflows that run without you is the point. This level makes you more efficient but is not yet a wealth-building level on its own." },
          { topic: "Level 4: AI Assets", type: "i", insight: "Using AI to build things you can sell — books, courses, music, content, tools. This is where income becomes possible. Critical caveat: if you skip the 12 levels of human creativity when building assets, you produce AI slop — content with no soul and no market. The creativity framework is what separates assets from noise." },
          { topic: "Level 5: Agentic AI", type: "i", insight: "You tell the AI the outcome you want, and based on how you've trained it, it figures out and executes the steps without you specifying each one. You're no longer giving instructions — you're giving objectives. The AI handles the path." },
          { topic: "Level 6: An arena of AI agents", type: "i", insight: "You own and control a garden of specialised AI agents working together on your behalf — running locally on your own machine, trained on your own frameworks and knowledge. Almost everything runs in this private system, not on public platforms. If your internet goes out, you can still talk to your AI." },
          { topic: "Level 7: Your own large language model", type: "i", insight: "The apex level: building your own LLM trained entirely on your knowledge, voice, and frameworks. Not using ChatGPT or Claude — being the model. This is a multi-year undertaking even for people with significant resources. Build the levels sequentially and only pursue this once you've mastered what's beneath it." },
          { topic: "Don't skip levels", type: "w", insight: "The temptation is to jump to level six or seven immediately. You'll end up bewildered and stuck. Each level builds the foundation for the next. Get the basics down on the level behind you, begin working on the level in front of you. That's how you progress without getting lost." },
        ]
      },
      {
        label: "Practical AI Setup: The Fundamentals",
        rows: [
          { topic: "Set up ChatGPT personalisation first", type: "i", insight: "Before using ChatGPT for anything substantive, go to Settings, then Personalisation, and configure your tone, style, and formatting preferences. Then enable Memory and tell it your name, occupation, and as much about yourself as possible. Most people have never done this and wonder why outputs feel generic. The tool performs to the context it's given." },
          { topic: "Use voice input (Whisper Flow)", type: "i", insight: "Install a voice-to-text tool like Whisper Flow to speak your prompts instead of typing. Three benefits: you give AI far more context (people type minimal words, they speak in full thoughts), you're faster, and everything is saved locally on your own machine — not locked inside a platform that could close your account. Your prompts are your intellectual property." },
          { topic: "Context is everything in prompting", type: "i", insight: "The quality of what you get back from AI is almost entirely determined by the richness of context you give it going in. A minimal prompt gets a minimal result — that is a law. Give AI your tone, your audience, your objective, your constraints, and your specific situation. The output ceiling is set by your input floor." },
          { topic: "Save your prompts locally", type: "w", insight: "If you build your entire prompt library inside ChatGPT or Claude and they close your account, you lose everything. Use a local voice-to-text tool that saves transcripts to your own device. Your prompts, your frameworks, your system instructions — these are assets. Store them somewhere you control." },
          { topic: "NotebookLM: learn anything in a weekend", type: "i", insight: "Go to notebooklm.google.com. Copy YouTube video links on any topic you want to master — add around 100 sources. NotebookLM watches all of them and builds a custom AI brain on that topic. You can then chat with it, generate mind maps, create flashcards, take quizzes, and listen to AI-generated podcast episodes. Zero to teachable on any subject in 48 hours." },
          { topic: "AI slop vs. humanity + AI", type: "w", insight: "AI slop is what you get when you give AI minimal input and expect brilliance in return. The world is filling up with it and audiences are developing an allergy fast. The antidote is always the same: put your full human creativity in first — your intention, your voice, your frameworks — then let AI amplify it." },
        ]
      },
      {
        label: "Business Thinking: Principles That Transcend AI",
        rows: [
          { topic: "Serve the greatest number of people", type: "m", insight: "The measure of greatness is the number of people you can serve value for. The more people you have the ability to help, the further up the ladder you go. Obsessing over solving other people's problems — not your own — is the entire game." },
          { topic: "Be interested, not interesting", type: "i", insight: "The way to be interesting is not to try to be interesting. The way to be interesting is to be genuinely interested in others. People who ask great questions are magnetic. The same applies to content: stop making the content you want to make and start obsessing over the problem your audience is living with." },
          { topic: "How can I afford it, not I can't", type: "m", insight: "When your transmission breaks, you figure out how to fix it. Things that don't change your life get solved. Things that could change your life get declined with 'I can't afford it.' The reframe: turn 'I can't afford this' into 'how can I afford this?' — the question forces your brain to find an answer instead of accepting a limit." },
          { topic: "Success mirrors itself across arenas", type: "m", insight: "Success in any arena mirrors success in every other arena because it's based on principles and patterns, not luck or timing. Timing without principles and patterns produces nothing. Your job is to understand principles deeply enough and recognise patterns reliably enough that when you apply human intelligence multiplied by artificial intelligence, the result is greater than one." },
        ]
      },
    ]

    guest: "Charles Duhigg",
    guestTitle: "Author of The Power of Habit",
    preview: "40-45% of what you do every day is a habit. Charles Duhigg breaks down the three-part loop behind every behaviour — and the three keystone habits that create a cascade of change across your entire life.",
    tags: ["Mindset", "Ideas", "Warning"],
    rowCount: 35,
    sections: [
      {
        label: "The Science of Habit",
        rows: [
          { topic: "What a habit actually is", type: "m", insight: "A habit is not a single thing. Every habit is made of three parts: a cue (a trigger), a routine (the behaviour itself), and a reward (the payoff your brain gets). The brain stores these as a loop — not a single action." },
          { topic: "How much of life is habit", type: "m", insight: "About 40–45% of what you do every day is a habit — including how you park, what you order for lunch, and how you react to your kids. You think you're making choices. Often you're not." },
          { topic: "Habits live in the basal ganglia", type: "m", insight: "The part of the brain that creates habits — the basal ganglia — exists in every animal. It is an energy-saving mechanism. When you're in a habit, your brain is actually thinking less, not more. It powers down to run the pattern automatically." },
          { topic: "Aristotle's framing", type: "m", insight: '"We are what we repeatedly do." Excellence is not an act — it\'s a habit. So is slacking off, procrastinating, and losing your temper. Every outcome in your life is the product of a pattern, not a character trait.' },
          { topic: "Habits shape identity, not talent", type: "m", insight: 'The research is clear: success is built on habits, not ability. The story you tell yourself about who you are — "I\'m not athletic, I\'m bad with money, I\'m a procrastinator" — is almost always a description of your habits, not your nature.' },
          { topic: "Any habit can be changed", type: "m", insight: "Because habits are loops with discoverable components, every single one can be modified. The mechanism is the same whether it's smoking, overeating, or procrastinating. Once you know how to break a habit into its parts, you can change any of them." },
        ]
      },
      {
        label: "Keystone Habits: The Hierarchy",
        rows: [
          { topic: "What a keystone habit is", type: "m", insight: "Some habits are more powerful than others. A keystone habit, when adopted, sets off a chain reaction that changes other unrelated behaviours — without you having to consciously target them. It creates a cascade effect through your life." },
          { topic: "Why the cascade works", type: "m", insight: "The mechanism is identity change. When you do a keystone habit, your brain begins building a new self-concept. That updated concept of who you are then quietly influences decisions all day — spending, eating, focus — without any extra effort." },
          { topic: "Stated vs actual preferences", type: "m", insight: "Your brain watches what you do, not what you say you'll do. The part of your brain that builds identity pays attention to actual behaviour, not intentions. Every time you act in line with who you want to be, your brain updates the model of who you are." },
        ]
      },
      {
        label: "Keystone Habit #1: Exercise",

const tagLabels = { Mindset: "Mindset", Ideas: "Ideas", Warning: "Warnings" };
const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  if (SUMMARIES.length === 0) {
    grid.innerHTML = '<div class="empty">No summaries yet — add some to the <code>SUMMARIES</code> array.</div>';
    return;
  }
  SUMMARIES.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open summary: ${s.title}`);

    const tagHTML = s.tags.map(t => {
      const cls = t === 'Mindset' ? 'pill-m' : t === 'Ideas' ? 'pill-i' : 'pill-w';
      return `<span class="pill ${cls}">${t}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-meta">
        <span class="card-ep">${s.episode}</span>
        <span class="card-date">${s.date}</span>
      </div>
      <h2>${s.title}</h2>
      <div class="card-guest">with <strong>${s.guest}</strong> · ${s.guestTitle}</div>
      <div class="card-tags">${tagHTML}</div>
      <p class="card-preview">${s.preview}</p>
      <div class="card-footer">
        <span class="card-count">${s.rowCount} key points</span>
        <span class="card-arrow">→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(s));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(s); });
    grid.appendChild(card);
  });
}

//  MODAL
// ══════════════════════════════════════════════
const overlay = document.getElementById('overlay');
const modalEp = document.getElementById('modal-ep');
const modalTitle = document.getElementById('modal-title-el');
const modalGuest = document.getElementById('modal-guest');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close-btn');

function typeClass(t) {
  return t === 'm' ? 'pill-m' : t === 'i' ? 'pill-i' : 'pill-w';
}
function typeLabel(t) {
  return t === 'm' ? 'Mindset' : t === 'i' ? 'Idea' : 'Warning';
}

function openModal(s) {
  modalEp.textContent = s.episode;
  modalTitle.textContent = s.title;
  modalGuest.innerHTML = `<strong>${s.guest}</strong> · ${s.guestTitle}`;

  let bodyHTML = `
    <div class="legend">
      <span class="legend-item"><span class="pill pill-m">Mindset</span> Mental models & philosophy</span>
      <span class="legend-item"><span class="pill pill-i">Idea</span> Actionable business ideas</span>
      <span class="legend-item"><span class="pill pill-w">Warning</span> Mistakes & things to avoid</span>
    </div>
  `;

  s.sections.forEach(sec => {
    bodyHTML += `<div class="summary-section">`;
    bodyHTML += `<div class="section-label">${sec.label}</div>`;
    sec.rows.forEach(row => {
      bodyHTML += `
        <div class="summary-row">
          <div class="row-topic">${row.topic}</div>
          <div class="row-type"><span class="pill ${typeClass(row.type)}">${typeLabel(row.type)}</span></div>
          <div class="row-insight">${row.insight}</div>
        </div>
      `;
    });
    bodyHTML += `</div>`;
  });

  modalBody.innerHTML = bodyHTML;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
