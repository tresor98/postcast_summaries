<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast Summaries</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0F0F0F;
      --surface: #181818;
      --surface2: #222222;
      --border: #2A2A2A;
      --text: #F0EDE6;
      --muted: #888880;
      --accent: #E8A838;
      --accent-dim: rgba(232, 168, 56, 0.12);
      --pill-m-bg: rgba(99, 130, 255, 0.15);
      --pill-m-text: #8FA8FF;
      --pill-i-bg: rgba(72, 199, 142, 0.15);
      --pill-i-text: #5ECFA0;
      --pill-w-bg: rgba(232, 168, 56, 0.15);
      --pill-w-text: #E8A838;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 48px 40px 36px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .header-left h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: var(--text);
    }

    .header-left h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .header-left p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 300;
    }

    /* signal wave SVG mark */
    .signal-mark {
      flex-shrink: 0;
      opacity: 0.35;
    }

    /* ── GRID ── */
    main {
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover {
      border-color: #3A3A3A;
      background: var(--surface2);
      transform: translateY(-2px);
    }

    .card:hover::before { opacity: 1; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-ep {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .card-date {
      font-size: 11px;
      color: var(--muted);
    }

    .card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text);
    }

    .card-guest {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .card-guest strong {
      color: #B0ADA6;
      font-weight: 500;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .pill-m { background: var(--pill-m-bg); color: var(--pill-m-text); }
    .pill-i { background: var(--pill-i-bg); color: var(--pill-i-text); }
    .pill-w { background: var(--pill-w-bg); color: var(--pill-w-text); }

    .card-preview {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-count {
      font-size: 11px;
      color: var(--muted);
    }

    .card-arrow {
      font-size: 16px;
      color: var(--accent);
      transition: transform 0.2s;
    }
    .card:hover .card-arrow { transform: translateX(4px); }

    /* ── MODAL OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      overflow: hidden;
      transform: translateY(16px);
      transition: transform 0.25s;
    }

    .overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 32px 36px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-header-left { flex: 1; }

    .modal-ep {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 400;
      line-height: 1.2;
      color: var(--text);
    }

    .modal-guest {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .modal-guest strong { color: #B0ADA6; font-weight: 500; }

    .close-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
      line-height: 1;
    }
    .close-btn:hover { color: var(--text); border-color: #444; }

    .modal-body {
      padding: 32px 36px 40px;
    }

    /* ── SUMMARY TABLE ── */
    .summary-section {
      margin-bottom: 36px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 180px 80px 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 13px 0;
      align-items: start;
    }

    @media (max-width: 600px) {
      .summary-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    .row-topic {
      font-size: 13px;
      font-weight: 500;
      color: #B0ADA6;
      padding-right: 16px;
    }

    .row-type {
      padding-right: 12px;
    }

    .row-insight {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }

    /* ── EMPTY STATE ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
    }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding: 14px 18px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px 40px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

//  RENDER GRID
// ══════════════════════════════════════════════
const tagLabels = { Mindset: "Mindset", Ideas: "Ideas", Warning: "Warnings" };
const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  if (SUMMARIES.length === 0) {
    grid.innerHTML = '<div class="empty">No summaries yet — add some to the <code>SUMMARIES</code> array.</div>';
    return;
  }
  SUMMARIES.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open summary: ${s.title}`);

    const tagHTML = s.tags.map(t => {
      const cls = t === 'Mindset' ? 'pill-m' : t === 'Ideas' ? 'pill-i' : 'pill-w';
      return `<span class="pill ${cls}">${t}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-meta">
        <span class="card-ep">${s.episode}</span>
        <span class="card-date">${s.date}</span>
      </div>
      <h2>${s.title}</h2>
      <div class="card-guest">with <strong>${s.guest}</strong> · ${s.guestTitle}</div>
      <div class="card-tags">${tagHTML}</div>
      <p class="card-preview">${s.preview}</p>
      <div class="card-footer">
        <span class="card-count">${s.rowCount} key points</span>
        <span class="card-arrow">→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(s));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(s); });
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════
const overlay = document.getElementById('overlay');
const modalEp = document.getElementById('modal-ep');
const modalTitle = document.getElementById('modal-title-el');
const modalGuest = document.getElementById('modal-guest');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close-btn');

function typeClass(t) {
  return t === 'm' ? 'pill-m' : t === 'i' ? 'pill-i' : 'pill-w';
}
function typeLabel(t) {
  return t === 'm' ? 'Mindset' : t === 'i' ? 'Idea' : 'Warning';
}

function openModal(s) {
  modalEp.textContent = s.episode;
  modalTitle.textContent = s.title;
  modalGuest.innerHTML = `<strong>${s.guest}</strong> · ${s.guestTitle}`;

  let bodyHTML = `
    <div class="legend">
      <span class="legend-item"><span class="pill pill-m">Mindset</span> Mental models & philosophy</span>
      <span class="legend-item"><span class="pill pill-i">Idea</span> Actionable business ideas</span>
      <span class="legend-item"><span class="pill pill-w">Warning</span> Mistakes & things to avoid</span>
    </div>
  `;

  s.sections.forEach(sec => {
    bodyHTML += `<div class="summary-section">`;
    bodyHTML += `<div class="section-label">${sec.label}</div>`;
    sec.rows.forEach(row => {
      bodyHTML += `
        <div class="summary-row">
          <div class="row-topic">${row.topic}</div>
          <div class="row-type"><span class="pill ${typeClass(row.type)}">${typeLabel(row.type)}</span></div>
          <div class="row-insight">${row.insight}</div>
        </div>
      `;
    });
    bodyHTML += `</div>`;
  });

  modalBody.innerHTML = bodyHTML;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
renderGrid();
</script>
