  {
    id: "seth-godin",
    episode: "Ep. 007",
    date: "July 2025",
    title: "How to Get More Out of Life: Make More Money and Build Something That Matters",
    guest: "Seth Godin",
    guestTitle: "Godfather of Modern Marketing & 20x Best-Selling Author",
    preview: "Who is it for? What is it for? Two questions that govern everything in business. Seth Godin breaks down why marketing to everyone markets to no one, the crucial difference between a freelancer and entrepreneur, and why your biggest obstacle is probably the boss inside your head.",
    tags: ["Mindset", "Ideas", "Warning"],
    rowCount: 40,
    sections: [
      {
        label: "The Foundation: Who's It For and What's It For?",
        rows: [
          { topic: "The two questions that govern everything", type: "i", insight: "Before doing anything in business, answer two questions with extreme specificity: Who exactly is this for? And what change am I here to make? If you can't answer both clearly, go back and start over. These two questions apply equally whether you're building a business, running a career, or deciding what to work on next." },
          { topic: "Marketing to everyone is marketing to no one", type: "w", insight: "If your answer to who's it for is anyone who needs what I do — you're doomed. Being available for everything means you stand for nothing. The hairdresser who only works on curly hair has a waiting list and charges more. The truck driver who only transports collectible cars gets called by name. Specificity is not a limitation. It's the entire strategy." },
          { topic: "The smallest viable audience", type: "m", insight: "How many people would be enough? Ask this before you ask how to reach millions. A real estate broker who deeply serves one luxury building, a real estate agent who knows every house in one town — these are not small thinking. They're the model. Enough people who love what you do is more valuable than millions who are indifferent." },
          { topic: "Generosity of specificity", type: "i", insight: "When you know exactly who you're for, you can send everyone else to someone better suited. That's not losing business — that's building trust and reputation. The Ferrari dealer who sends the family of seven to a Volvo dealership. The curly hair specialist who sends the straight-haired client down the street. Referrals are the dividend of specificity." },
          { topic: "Do work that's worth doing", type: "m", insight: "Life is short. Why would you waste a minute or a day or a year just doing your job if you have any other option? You are not stuck in traffic — you are traffic. Stop waiting for permission to build something better. Are you making excuses about the system, or are you making the system better?" },
        ]
      },
      {
        label: "Entrepreneur vs Freelancer: Know Which One You Are",
        rows: [
          { topic: "Freelancer vs entrepreneur — they are different", type: "m", insight: "A freelancer gets paid when they work. They and they alone do the work. A freelancer cannot scale because they are the product. An entrepreneur uses assets to build something bigger than themselves and makes money when they're asleep. Most people who call themselves entrepreneurs are actually freelancers. Neither is wrong. Confusion between the two is what causes the stress." },
          { topic: "The dead zone in between", type: "w", insight: "The most dangerous place is the middle — 8, 18, or 30 people, doing all the jobs yourself, not getting paid enough, too busy to market, too small to delegate. This is where talented freelancers land when they dream of building something bigger but haven't made the real leap. Decide which one you are and build accordingly." },
          { topic: "Every time you hire yourself, ask what you're hiding from", type: "i", insight: "The entrepreneur's real job is to build assets — things that work without them. Every time you're tempted to do a job yourself because it's faster or cheaper, ask: what am I hiding from? You're avoiding the harder, more important work of building the thing that scales. Being busy doing everything is fear dressed up as productivity." },
          { topic: "Freelancers: get better clients, not more clients", type: "i", insight: "A freelancer can't have more clients — they can only have better ones. Better clients challenge you more, pay you more, and talk about you more. You don't get better clients by doing good work for bad clients. You get them by showing up where better clients look and doing the kind of work better clients want. Guard your time like gold. You don't get it back." },
        ]
      },
      {
        label: "What Business Actually Is (and Isn't)",
        rows: [
          { topic: "Business is not about what you make", type: "w", insight: "If you want to start a granola business, understand: you will almost certainly never be making granola. Being in the granola business means logistics, marketing, packaging, customer service, finance, supply chain, and managing people. Before starting any business, ask: how do I actually want to spend my day?" },
          { topic: "Once it's a business, it belongs to the customer", type: "m", insight: "The moment you turn a hobby into a business, it is no longer yours — it belongs to your customers. They don't buy your candles because you want them to. They buy because it's their best option under the circumstances. Don't turn something that gives you joy into a business unless you're prepared to hand it over. Don't let a business ruin your hobby." },
          { topic: "Don't pick a glamorous business", type: "w", insight: "Don't pick a business that everyone is buzzing about — it will be filled with people doing it as a hobby, driving prices down. Instead, find a problem that a specific group of people with money desperately need solved, and solve it. Unglamorous problems that matter to the right people are where sustainable businesses live." },
          { topic: "The joy of showing up to make things better", type: "m", insight: "Seth has had many businesses, most of which didn't make much money. Like Picasso, who painted many paintings but only a few became famous — the act of showing up to make things better for other people is its own reward. We earn dignity, reputation, and community. That's what business, at its best, actually is." },
        ]
      },
      {
        label: "Marketing: What It Actually Is",
        rows: [
          { topic: "Marketing is not familiarity", type: "w", insight: "People don't buy from people who are familiar to them. Showing up on social media, becoming familiar, and waiting for people to buy is not marketing. One person got 40 million views on TikTok and sold four copies of his book. Entertaining people on TikTok is not the same as solving their problem. Those are completely different transactions." },
          { topic: "Marketing creates tension, then relieves it", type: "m", insight: "Real marketing tells a story that creates tension — the tension of being left out, of falling behind, of maybe this is for me. That tension spreads because it's remarkable — worth talking about. Then people relieve the tension by buying. That's the mechanism. Not: post consistently and hope familiarity converts." },
          { topic: "Idiosyncrasy beats average", type: "i", insight: "Being called idiosyncratic is often viewed as an insult. It shouldn't be — it's the opposite of average. The normal spot is already taken in every category. You will never be the normal one. So stop trying. What makes you the idiosyncratic one that a specific group of people would miss if you were gone?" },
          { topic: "Be someone they'd miss if you were gone", type: "m", insight: "Whether you're a waitress, a freelancer, or building a career, the goal is the same: be someone they would miss if you were gone. There is a shortage of people who make promises and keep them. A shortage of people who light up a room. You might not be the most skilled or privileged — but you can market this story and inhabit it and become the contributor you're proud to be." },
          { topic: "Your personal brand is already running", type: "i", insight: "Whether or not you have a business, you already have a brand — a promise you make to the people around you. Every time you open your mouth in a meeting, people have an expectation of what they're going to hear. Nike has a brand. Hyatt has a logo. A brand is when people know what to expect. What do people expect from you?" },
        ]
      },
      {
        label: "Choosing Your Customers",
        rows: [
          { topic: "Choose your clients, choose your future", type: "i", insight: "The clients you choose determine how you spend your day. Stressed-out brides mean wedding emergencies every weekend. Penny-pinching clients mean arguing over every line item. You are not choosing a client — you are choosing your daily life. Choose deliberately, not by default." },
          { topic: "Don't let clients choose you", type: "w", insight: "If you let whoever shows up decide who your clients are, you've handed over control of your day, your energy, and your standards. When you pick your customers — their stories, their fears, their budgets — you've announced how you want to spend your days. Reclaim that decision." },
          { topic: "Selling to friends is a disaster", type: "w", insight: "When you sell to friends out of obligation, you're asking them to buy something that may not be their best option because of the relationship. That's not service — that's leverage. You want to be the obvious choice because you're genuinely the best option, not because someone feels they owe you." },
        ]
      },
      {
        label: "Fear, Perfectionism, and Resistance",
        rows: [
          { topic: "Name the real fear", type: "m", insight: "It's easy to conflate fear with tasks at hand: my product isn't ready, the copy isn't quite right yet. But that's usually not what you're afraid of. You're afraid of the transaction — of a stranger saying no. Name the actual fear. You can't make it go away, but you can dance with it. What you can't do is avoid it by only doing the stuff that doesn't scare you." },
          { topic: "The $10 bill exercise", type: "i", insight: "Go to a bus station with a $10 bill. Ask a stranger if they'll give you a $5 for it. It's an obviously good deal. And it's terrifying. That terror is exactly what you feel when you try to sell something — even something obviously worth more than you're charging. The exercise makes the fear specific so you can work with it instead of hiding from it." },
          { topic: "The Girl Scout cookie question", type: "i", insight: "Girl Scouts yelling 'Want to buy some Girl Scout cookies?' get ignored. The ones trained to ask 'What's your favourite kind of Girl Scout cookie?' stop people in their tracks — because everyone has an answer, and answering puts them in a conversation. Change the question you're asking to get people to engage, not escape." },
          { topic: "Perfectionism is hiding", type: "w", insight: "If what you're offering would make someone's life better, how dare you hold it back because it isn't perfect? Who's it for and what's it for — if it's doing its job, ship it. You're not doing surgery. If it doesn't work for a few people, go make it better. If it does work, go do the next thing. The perfectionist is not protecting quality. They're protecting themselves from feedback." },
        ]
      },
      {
        label: "Making Good Decisions",
        rows: [
          { topic: "Good decisions and good outcomes are unrelated", type: "m", insight: "If you buy a lottery ticket and win, you made a bad decision and got lucky. If you make a careful, well-reasoned decision and it turns out badly, you made a good decision and got unlucky. Stop conflating outcomes with decisions. A good decision is simply: would a thoughtful person with the information I had choose what I chose? If yes — it was a good decision, full stop." },
          { topic: "Write three completely different business plans", type: "i", insight: "Write three completely different business plans for any idea — who's it for, what's it for, who am I serving, how will I know if it's working. Then randomly pick one. The point: you can't fall out of love with plan A until you've made plan B and C genuinely compelling. When you have one plan, you defend it. When you have three, you think with your whole brain." },
          { topic: "Make decisions your future self will thank you for", type: "m", insight: "The sunk costs — the blood, sweat, tears, time, and money already spent — are gone no matter what. The question is never what did I spend to get here? The question is always: tomorrow, given what I know now, do I want to keep going or build something new? Yesterday's investment doesn't vote on tomorrow's decision." },
        ]
      },
      {
        label: "Feedback, Criticism, and Metrics That Matter",
        rows: [
          { topic: "Criticism is about them, not you", type: "m", insight: "When someone criticises your product, they are saying: based on who I am and what I see, this isn't for me. Getting defensive helps no one. It doesn't matter what you want or like. It matters what the customers you've chosen to serve believe and need. As soon as you tell a customer they're wrong, they're not your customer anymore." },
          { topic: "Stop measuring what will distract you", type: "w", insight: "One-star reviews, follower counts, download numbers, views — if these metrics aren't directly aligned with the change you're trying to make, they will consume you and distort your decisions. Create a boundary so you never see the stuff that's going to derail you. Compared to what? is always the right first question when you look at a number." },
          { topic: "The people who like you online don't like you", type: "w", insight: "The people who like you online are not your fans. The people who follow you online are not your followers. They're clicking buttons because the algorithm wants them to. Connection and genuine impact with a smaller, right group of people beats vanity metrics with a large disengaged audience every time." },
        ]
      },
      {
        label: "Quitting vs Sticking: The Dip",
        rows: [
          { topic: "Quitting is not failure — it's strategy", type: "m", insight: "You quit ballet at six. You quit your first job. We all quit things as we grow up, but somewhere quitting became shameful. That's wrong. You couldn't be the best in the world at what you do now if you hadn't quit some other thing first. The question is never should I quit or persist? The question is what kind of thing is this?" },
          { topic: "Is there a dip or a slog?", type: "i", insight: "The dip is the hard part before it gets easier — the February at the gym. If you can see someone who's come before you and gotten through it, that's a dip worth pushing through. But some things are not dips — they're slogs. They just keep getting worse. If no one has ever made it through, that's not a dip. That's a cue to redirect your energy." },
          { topic: "Sunk costs don't vote", type: "m", insight: "The money, time, and effort you've put into a business are gone no matter what you decide next. They bought you the knowledge and experience you have now. Tomorrow you can either accept that as a gift from your past self and build on it — or walk away and build something new. What you cannot do is let yesterday's investment make today's decision. That's not strategy. That's stubbornness." },
        ]
      },
      {
        label: "The World's Worst Boss (You)",
        rows: [
          { topic: "You might have the world's worst boss", type: "m", insight: "This boss doesn't appreciate you. They nitpick constantly. They push you to conform and fill you with negative talk. They undermine everything you try to build. You've probably guessed: that boss is you. The story running inside your head is the most powerful force shaping your work — and if it's denigrating, undermining, and fear-amplifying, no tactic will fix it." },
          { topic: "Find a circle to change the voice", type: "i", insight: "You would never work for a boss like the one inside your head in the real world. So don't work for yourself that way. Find people who are doing work you respect and support them first. Show up for them. When you say I'm here to help you see where you're going — they will often return the favour. Community starts by contributing, not by asking." },
          { topic: "This is really hard to do alone", type: "m", insight: "The final answer is simple: find someone and do it with them. Put words on what you're doing. Tell yourself the truth. Measure the right things and ignore everything else. Make a difference. Do work you're proud of for people who care. Not alone — with someone." },
        ]
      },
    ]
  },
  {
    id: "shellyann-fraser-pryce",
    episode: "Ep. 008",
    date: "July 2025",
    title: "If You Only Watch One Video This Week, Make It This One",
    guest: "Shellyann Fraser-Pryce",
    guestTitle: "Olympic Gold Medallist & World Champion Sprinter",
    preview: "One year of being intentional got her an Olympic gold medal. Shellyann Fraser-Pryce breaks down the mindset behind becoming unstoppable — visualization, standards vs motivation, how failure tells you how, and why you are the moment.",
    tags: ["Mindset", "Ideas", "Warning"],
    rowCount: 45,
    sections: [
      {
        label: "The Decision: Where Everything Starts",
        rows: [
          { topic: "Decide first", type: "m", insight: "The most important thing anyone can do is decide. Not plan, not research, not wait for the right moment — decide. Decide to move from average to excellence. Decide who you want to be. Decide what you're going to hold onto. And then every morning, decide again: one foot in front of the other." },
          { topic: "Stop asking permission to be great", type: "m", insight: "Stop asking people who have no idea where you're coming from or where you're going whether you're allowed to dream. Your voice is the most important voice in the room — the only one that matters. The external voices are white noise. They don't understand what it is to chase something great." },
          { topic: "Half decisions don't count", type: "w", insight: "A lot of people make half decisions: I'll do it tomorrow, I'll start next year, maybe next week. That's not deciding — that's deferring. Until you make the full decision and commit, you're wasting time. You can have the vision board, the goal journal, the business plan — and still go nowhere. Decide now. Commit now." },
          { topic: "Dreaming is a luxury and a necessity", type: "m", insight: "Growing up in Waterhouse, Kingston, dreaming felt like a luxury — when the environment feels like there's no way out, imagining something beyond it seems unrealistic. But dreaming is also a necessity. The only dream that hasn't been met is the one you haven't started. Once you have a dream, start it. Don't wait for a sign — the starting is the sign." },
        ]
      },
      {
        label: "A Lot Can Change in One Year",
        rows: [
          { topic: "One intentional year", type: "m", insight: "In 2007, Shellyann was the sixth reserve on Jamaica's relay team — the last person called and only if someone got hurt. One year later, she was Olympic champion in the 100 metres. One year of being intentional got her an Olympic gold medal. Not talent, not luck — intentionality applied consistently over 12 months." },
          { topic: "What actually changed", type: "i", insight: "What changed between 2007 and 2008 wasn't her body — it was her mindset, her consistency, and her ownership. She changed what she ate, started going to the gym, arrived at 5am because practice was at 5am — not 5:30. Consistency at the small things is what scales." },
          { topic: "Own it — win or lose", type: "m", insight: "The Osaka moment in 2007 wasn't about losing — it was about realising she wanted to stand at the line alone. If she wins, it's hers. If she loses, it's hers. Nobody gets to take that from you. That desire for ownership became the fuel that changed everything." },
          { topic: "For the person chasing greatness, one year is a lot", type: "m", insight: "For the person chasing mediocrity, one year seems small. For the person chasing greatness, one year is a lot. You have time. But you have to make it count — showing up every morning, putting one foot in front of the other, refusing to stop. Someone will have to drag you off the field." },
        ]
      },
      {
        label: "Visualization: Training the Mind Before the Body",
        rows: [
          { topic: "Visualization is preparation", type: "i", insight: "Fridays for Shellyann are not running days — they are mental training days. Before you can achieve anything, you have to see it in your mind first. Visualization is putting yourself in a winning position before you have won. It's not imagining perfection — it's seeing yourself doing it powerfully. It's preparation, not fantasy." },
          { topic: "Your mind can't distinguish reality from vivid imagination", type: "m", insight: "When you visualize with full sensory detail — smell the atmosphere, feel the blocks, hear the starter — your mind can't fully distinguish that from reality. That's the power. By the time Shellyann gets to the starting line, she has already run that race hundreds of times in her mind, months before race day. Her body knows what to do because her mind already has." },
          { topic: "Visualization is free", type: "i", insight: "You don't need money, paper, or a vision board. You just need to sit with yourself and see it. That presentation, that hard conversation, that relationship you need to end, that friendship you need to walk away from — do it in your mind first. It becomes easier after. Visualization exists long before the vision board." },
          { topic: "Use a cue to stay in the visualization", type: "i", insight: "Visualization is practice — it doesn't come easy the first time. Your mind drifts. The fix: have a cue ready to pull yourself back. Shellyann's cue is a phrase: Greater is he that is in me than he that is in the world. Find yours — something that snaps you back into the vision and reconnects you to the moment you're preparing for." },
          { topic: "Set the stage before the moment arrives", type: "i", insight: "Before the 2008 Olympics, Shellyann told a teammate: If I win, I am going to jump. I'm going to scream. She was already setting the stage for what was coming. When she crossed the line, she did exactly that. The mind had already rehearsed the win, which made the win possible. Speak the outcome before it happens." },
        ]
      },
      {
        label: "Standards vs Motivation",
        rows: [
          { topic: "Motivation changes. Standards don't.", type: "m", insight: "Motivation is fleeting — what motivates you today may not motivate you tomorrow. If your drive is tied to a person who wronged you, what happens when that person leaves or changes? Standards are different. Standards are who you are. They don't move based on how you feel on any given day. That's what gives you longevity." },
          { topic: "Don't tie your motivation to a person", type: "w", insight: "A lot of people are motivated by someone who wronged them, or someone they want to prove something to. That's fragile fuel. The minute that person moves on or changes — the motivation disappears. Your standards have to be internal and unconditional, not dependent on someone else's behaviour." },
          { topic: "Excellence requires consistency", type: "m", insight: "How does one achieve excellence? Consistency. How does one have standards? Move from fear to boldness. Discipline resides there — it's not a visitor, it's a resident. The standard is excellence. The path to the standard is showing up, especially on the days when there's no motivation to show up." },
          { topic: "Start with small intentional steps", type: "i", insight: "If you don't know what your standards are, start small. Get up early. Make your bed. Have your coffee. Visualize for 20 minutes. Write it down. A week later, add something else. That becomes a routine. The routine becomes consistent. The consistency becomes the standard. It doesn't have to be a grand declaration — it has to be yours and it has to be daily." },
        ]
      },
      {
        label: "Failure Is Part of Success — Not the Opposite",
        rows: [
          { topic: "Failure introduces you to yourself", type: "m", insight: "When you win, you think you have it figured out. Failure introduces you to the part of yourself that needs to grow, the part you need to approach differently. Some of Shellyann's greatest wins came directly after losses. Failure doesn't signal the end — it signals a new approach is needed." },
          { topic: "Failure tells you how", type: "m", insight: "Failure doesn't just show you what didn't work — it shows you how to do the next thing. When Shellyann fractured the sesamoid bones in her foot before the 2016 Olympics, she couldn't train normally. She found another way: gym, pool work, rehab. Failure tells you how. The question is whether you're willing to listen and adapt rather than quit." },
          { topic: "Losers quit after failure. Champions don't.", type: "m", insight: "The difference between the people who lose and the people who lost is simple: the ones who lost went back to the drawing board. They didn't quit. Shellyann lost many races. She never quit. In 2016 she got a bronze with a fractured foot. In 2019, two years after having her son, she was world champion again. The comeback is always built on the loss." },
          { topic: "Failure is a pivot, not a period", type: "i", insight: "What you did to get here won't necessarily get you there. The things that made you successful in 2024 will not make you successful in 2025. Failure is the signal that the old approach needs adjusting. Change your approach. Adjust. Come back. The race isn't over — you just got information about how to run it differently." },
        ]
      },
      {
        label: "Motherhood, Age, and the Voices That Try to Stop You",
        rows: [
          { topic: "Motherhood deepened the purpose", type: "m", insight: "When Shellyann got pregnant in 2017, the critics said her career was over. Instead, having her son deepened her purpose. Her son didn't need her to sacrifice her career — he needed to see her chasing her dreams so he'd know he had permission to chase his. Two years after giving birth, she won the World Championship in Doha. Her son was on the track celebrating with her." },
          { topic: "You get to decide what's possible for you", type: "m", insight: "The outside world will always have a conversation about what women can do, when they're relevant, whether they can be both a mother and a high performer. Your conversation is not my reality. You get to decide what being a mother and a world champion means. When you decide for yourself — not listening to left or right — you change the game you're playing." },
          { topic: "Age is irrelevant at the line", type: "m", insight: "Shellyann won the World Championship at 35 in a sport where 28 is considered old. Nobody at the starting line is thinking about your age. Your age is irrelevant to success. The commentators are noting it, the critics are betting against it — and you're not listening to any of them. Your confidence comes from your work, not your birth year." },
          { topic: "You need nobody's permission but your own", type: "m", insight: "Too many athletes retire because they feel they need someone else's permission to keep going — someone else's opinion on when to tap out. Shellyann needed no one's permission but her own. If you want it, you have to come for it. And if someone else wants it too, they'll have to beat you on the day. That's it." },
        ]
      },
      {
        label: "Focus, Competition, and Not Looking Left or Right",
        rows: [
          { topic: "When you focus on them, you're helping them win", type: "m", insight: "When you focus on what someone else is doing — their success, their pace, their strategy — you are literally giving them your power. They're probably focused on you. You're giving your energy away. At the line, Shellyann is an assassin. She hears nobody. The I becomes selfish in that moment. It's about how you show up, not who's next to you." },
          { topic: "Eat the meat, leave the bone", type: "i", insight: "Jamaican saying: when someone feeds you chicken, eat the meat, leave the bone. If someone ahead of you has something you want — an approach, a discipline, a mindset — take what serves you and leave what doesn't. Even from someone you're jealous of, even from someone you don't like, there's usually something worth learning. Extract the value. Don't waste the envy." },
          { topic: "You are the moment", type: "m", insight: "A lot of people get to the big moment and the moment becomes bigger than them — it stifles their performance. The moment is the moment. It won't change. But you are the moment. What you bring is the moment. The months of preparation, the visualizations, the 5am sessions — that's what shows up when the lights are bright. Don't let the lights move you." },
        ]
      },
      {
        label: "Pressure, the Past, and Competing Where Your Feet Are",
        rows: [
          { topic: "Pressure is a privilege", type: "m", insight: "Nobody stones green mangoes — they're not ripe. If you feel pressure, it's because you have something — a gift, a purpose, an untapped potential that's ready to emerge. Pressure means someone, including yourself, believes you have more to give. Reframe it: pressure is not a threat. It's confirmation that you're on the right track." },
          { topic: "Don't fight two wars at once", type: "w", insight: "Pressure expands when you're living in the past and the future at the same time. Your brain doesn't know what's happening. The past is gone — you can't fix it from here. The future hasn't arrived. You can only compete where your feet are. Right here. Right now. That's the only race available to you." },
          { topic: "The past is information, not a home", type: "m", insight: "You can learn from the past — but you can't live there. The mistakes, the failures, the relationships that went wrong — they're gone. The people who are stuck are the ones still feeling pressure from things that already happened, still rerunning races they lost years ago. There's a new starting line every day. Step up to it." },
          { topic: "Pressure behind you is fuel", type: "m", insight: "Pressure feels completely different depending on its direction. Pressure in your face — consuming, stifling, closing in. Pressure behind you — pushing, propelling, confirming you're on the right path. The shift happens the moment you decide and lock into a future you're running toward. The pressure doesn't disappear. It just changes sides." },
          { topic: "Everything changes downstream when upstream is right", type: "m", insight: "When you fix what's happening in your mind — when you stop negotiating your mornings, stop entertaining the small voice, stop living in the past — everything downstream responds. Your body, your energy, your decisions, your actions: they all follow what's happening at the top. Get upstream right first." },
        ]
      },
      {
        label: "Inner Voice, Self-Talk, and the Champion's Mindset",
        rows: [
          { topic: "Your voice is the most important in the room", type: "m", insight: "The relationship you have with your own voice determines everything else. Most people are listening to commentators calling the play from the outside while they should be the loudest voice in the room. Channel the energy of your own voice. The minute you change that relationship, you start to understand what you actually want." },
          { topic: "Stop entertaining the small voice", type: "w", insight: "There's a voice in your head that tells you to play small — this is too big, this isn't for you, leave that one alone. Stop entertaining it. Stop negotiating your mornings. Get up, decide, and commit. Don't give that voice the attention it's asking for. Every time you negotiate with it, you lose ground." },
          { topic: "Be kind to yourself in self-talk", type: "i", insight: "The things you say to yourself in your darkest moments are often not true. When you get to the line, your self-talk should be strength, power, and confidence — not because things are perfect, but because you prepared. Replace the dark-moment script with: I can. I will. I must. This is mine." },
          { topic: "Go back to your past wins", type: "i", insight: "On the hard days — when the pressure is high, when self-doubt is creeping in — go back to the moments you have won. Rely on them. Those experiences tell you what you're capable of. Your past wins are evidence. Use them like a bank account you draw from when your confidence runs low." },
        ]
      },
      {
        label: "Rest, Recovery, and the Long Game",
        rows: [
          { topic: "Rest is as important as training", type: "i", insight: "Nobody shows up and wins on an empty tank. You have to be refuelled. When Shellyann got pregnant and couldn't do her planned surgery, the enforced rest allowed her sesamoid bones to heal to 80%. That rest gave her back the power she would have permanently lost from the surgery. Rest is not a break from the work. It is part of the work." },
          { topic: "Time will honour your greatness", type: "m", insight: "World champion at 35. Olympic gold at what others called too young and too inexperienced. World champion again two years after giving birth. Time is not your enemy. Time will honour your greatness if you keep showing up. It's never too late. The only finish line you haven't crossed is the one you never walked up to." },
        ]
      },
    ]

  {
    id: "macy-mcneely-sales",
    episode: "Ep. 009",
    date: "July 2025",
    title: "Top Sales Expert: This Simple Sales Trick Will Print You Money",
    guest: "Macy McNeely",
    guestTitle: "Sales Expert & Founder of The Department",
    preview: "Stop explaining. Every time you explain your expertise, you flatten the emotion — and emotion is what puts people in motion. Macy McNeely breaks down why certainty sells, why empowerment beats excitement, and how to walk someone across a bridge of belief, one thought at a time.",
    tags: ["Mindset", "Ideas", "Warning"],
    rowCount: 45,
    sections: [
      {
        label: "Why New Business Owners Suck at Sales",
        rows: [
          { topic: "Obsessed with craft, not customer", type: "m", insight: "Most new business owners are so in love with what they do — the art, the craft, the sport of creating — that the moment they have to talk about what someone else gets out of it, they freeze. They love explaining. But explaining is the enemy of selling." },
          { topic: "Explaining flattens emotion", type: "m", insight: "The etymology of explain comes from the Latin explainare — literally to flatten. Every time you explain your expertise, you flatten the emotional energy in the room. And emotion is what puts people in motion. Sales is putting someone in motion. The more you explain, the less you sell." },
          { topic: "Feel before understand", type: "m", insight: "Someone has to feel something before they can understand something. Grey's Anatomy made people want to become doctors — not because it explained medicine, but because it made them see their future. Don't explain your expertise. Apply it to someone's future. That's how you sell." },
          { topic: "The care etymology", type: "i", insight: "The word care doesn't mean love. It means burden — it's so heavy you can't stop thinking about it. That's what you want your prospect to feel: I can't stop thinking about what you just told me, and it's heavy enough that I want to pay to get it off of me. That's a sale." },
          { topic: "Natural salespeople are liabilities", type: "w", insight: "The chatty, high-energy person everyone calls a natural salesperson is usually terrible. They dominate the energy instead of directing it. Good sales means meeting people where they are and guiding them to a specific emotion — not filling the room with your own." },
        ]
      },
      {
        label: "What Sales Actually Is",
        rows: [
          { topic: "Sell the payoff, not the product", type: "i", insight: "Train your brain by practicing on everyday objects — pick up a jar of salsa and ask: how would this person's life be different with this? How would I frame it for a new mom, a mother-in-law, a husband? What would make this worth $50? The ratio is one logical piece to five emotional pieces. What you do, then what they get — that's the road." },
          { topic: "Sales is a process, not an event", type: "m", insight: "The swipe of the credit card is the beginning, not the end. The sale continues every time your face appears — you're selling them on the next step, on showing up, on getting the value they paid for. If people aren't using what they bought, you're not selling them on it. Never not selling." },
          { topic: "Sell every component like it's the whole price", type: "i", insight: "If your program costs $25,000 and includes an event, sell the event as if the event alone is worth $25,000. Whatever energy you bring to something is the energy others receive it with. You don't get what you want — you get who you are." },
          { topic: "Persuasion is a place you operate from", type: "m", insight: "Most people learn sales only in the context of their business — so they think of it as a task. That's not sales. Sales is a place you operate from in every conversation, every day. Learn it on purpose, outside your context, and it transfers everywhere. Becoming a better buyer makes you a better salesperson — invest in things that stretch you so you can speak to the payoff from experience." },
        ]
      },
      {
        label: "The Emotion You're Trying to Create",
        rows: [
          { topic: "Not excitement — empowerment", type: "m", insight: "The goal is not to get someone excited. Excited is this will be easy, just press the button. Empowered is this will be challenging and I know I can do it. Easy-button selling creates disappointed customers who quit at the first inconvenience. Empowered customers show up and push through." },
          { topic: "Empowerment requires edge, not comfort", type: "m", insight: "Macy's father pushed her to do a three-day live event 37 weeks pregnant, living out of her parents' home with her house falling apart. She was furious. But when she finished, she felt empowered — confident, capable, made for this. Empowerment arrives after the edge, not before. How someone gets sold affects how they show up once they buy." },
          { topic: "Anticipation and belief in the challenge", type: "m", insight: "The target emotional state is anticipation — the belief that a positive outcome is on the other side, paired with willingness to work for it. This is going to be challenging and I'm excited about that challenge. That's the state that produces committed customers who stay, do the work, and get results." },
        ]
      },
      {
        label: "Certainty Is the Only Thing That Sells",
        rows: [
          { topic: "Certainty beats tone, script, and style", type: "m", insight: "There are four types of buyers — some need logic, some emotion, some speed, some nurturing. Style varies. What never varies is that what actually sells is certainty. A look in the eye that says: I care about you, I want you to win, and I have no doubt this is right. That comes through in any tone, at any pace." },
          { topic: "Your mouth is the faucet, your state is the water tank", type: "m", insight: "People obsess over the sentences. But sentences come from state. If you're nervous, fearful, doubtful, or unsure — that comes out no matter what words you say. You can't have the right state without the experience that builds it. Feel the pain and the payoff yourself. Then you can speak to both with conviction." },
          { topic: "Sell every day to build certainty", type: "i", insight: "Certainty comes from volume. Sell every day. Sell an idea. Sell your kid on broccoli. Sell a belief. The more you sell, the more certain you become. The more certain you are, the more you sell. Selling is the prerequisite to certainty — not the other way around. Macy sold protein powder daily for six months without looking at the backend. After six months: a $10,000 month." },
          { topic: "Think about them, not yourself", type: "i", insight: "When you start thinking about what to say, how you're coming across, what your tone is — you crash and burn. When you're obsessed with: how do I help you win? What thought is in your way? How do I meet you where you are? — you come off exactly right. The shift from self-focus to other-focus is not a technique. It's the whole game." },
        ]
      },
      {
        label: "The Workhorse Method",
        rows: [
          { topic: "One logical piece, five emotional", type: "i", insight: "The workhorse is the core unit of Macy's sales method. One logical piece — a concrete, provable fact about what you deliver. Five emotional pieces — what that fact means for the person in front of you. The ratio is heavily weighted toward the emotional application because logic makes people think, emotion makes people move." },
          { topic: "Fact, so you can, outcome", type: "i", insight: "The workhorse structure: state one fact that can be proven in a court of law (you will get five posts per week), then connect it with so you can to the specific future they want (so you can stay in your zone of genius). Not I will post — you will get. Not a generic outcome — their specific outcome. This is the road most sellers never pave." },
          { topic: "You have the top of the puzzle", type: "m", insight: "Prospects have the puzzle pieces but don't know what the finished picture looks like. You do. Your job is to hold up the lid and say: look how good this gets. People often have no idea how good their life could become — they're operating from their current ceiling. Paint that picture for them. If they can't picture it, it's not persuasive." },
          { topic: "Say you — never I", type: "i", insight: "You are not allowed to say the word I in a sales conversation. Not I will post five times a week — you will get five posts per week. When you say I, people's brains go passive. When you say you, they wake up — because it triggers the only question they're always asking: what's in it for me? Overcorrect so hard that you becomes your automatic default." },
          { topic: "Stay in the workhorse when desperate", type: "i", insight: "When outcome pressure creeps in and desperation kicks in, the workhorse is your anchor. It forces you back to: what's the fact, what do they get, what's their specific future. Your brain leaves yourself and goes to them. Desperation is misdirected focus on your outcome. The workhorse redirects it to theirs." },
        ]
      },
      {
        label: "Objections and the Bridge Framework",
        rows: [
          { topic: "Objections are planted by your language", type: "w", insight: "Almost always, when you keep hearing the same objection, you planted it. The language you're using, the operating system driving that language — it shows up in what they say back. Before trying to handle an objection, look at yourself first. What are you saying that's creating it?" },
          { topic: "Sales is a bridge, thought by thought", type: "m", insight: "Sales is a bridge from where someone is to where they want to be. You walk them across it one thought at a time. The mistake is driving hard toward the outcome without addressing the thought blocking them right now. Someone who feels vulnerable in group coaching needs to believe it's safe before they can think about the outcome. Meet them at the current thought first." },
          { topic: "What's in the way, not the outcome", type: "i", insight: "People don't fail to buy because of the outcome. They fail because something is in the way. Before speaking at an event, Macy texts the host one question: What is the one thing you want them to stop believing? That's her job — clear that specific belief out of the way so people can move. You can't put new beliefs on top of old ones." },
          { topic: "Replace the story, don't take it", type: "i", insight: "You can't take candy from a baby without giving them something else to grab first. A prospect holds a limiting story — you can't remove it with logic. You have to offer a better story so compelling they're willing to release the old one and grab the new one. This is why you're always on a story hunt: looking for a story that attaches to the next belief they need." },
          { topic: "Know 100x more than you'll ever say", type: "m", insight: "Think about sales like a court case. Every juror has to be unanimous — through evidence, not assertion. You have to know a hundred times more than you'll ever say, so you can say exactly the right thing at exactly the right time for exactly this person. That's only possible if you're focused on them, not your script." },
        ]
      },
      {
        label: "Live Coaching Demo: The Workhorse in Action",
        rows: [
          { topic: "Don't ask about the product — ask about the person", type: "i", insight: "Abby's first instinct when selling her content repurposing service was to ask about social media and content — her area of expertise. Macy stopped her. Ask about the person first, not the product. Not do you struggle with content — that's a tactic question, and you go there because tactics feel comfortable. Ask the person. Listen. Then apply your expertise to their future." },
          { topic: "Ask why, not what", type: "i", insight: "When you ask what do you do you get tactics and logistics. When you ask tell me the story of why you do what you do you unlock the subconscious. Story creates emotion. And everything emotional they share becomes the raw material you use to sell back to them through the workhorse. Tactics give you facts. Stories give you fuel." },
          { topic: "The workhorse in practice", type: "i", insight: "Once Macy had the story, she coached Abby to build the workhorse: one fact (you will get five posts per week) connected to a specific outcome (so you can stay in your zone of genius). Then: say it like you believe it. Not casual — certain. The certainty in delivery is what makes the sentence land. Say it the way you'd say something you'd stake your reputation on." },
          { topic: "Role-play in a warm seat", type: "i", insight: "Practice live in a low-risk environment — the warm seat. The whole point of role-playing is that you do it automatically in the next real conversation. Mess it up in the warm seat so you don't mess it up with a real prospect. Mastery is the use of unconscious resources to perform any given task. The goal is to do all of this without thinking — which only comes from repetition." },
        ]
      },
      {
        label: "Q&A: Selling Outcomes vs Feelings",
        rows: [
          { topic: "Sell outcomes — applied to their specific future", type: "i", insight: "Don't sell 10x your income as a generic outcome. Apply it to someone's specific, concrete, imaginable future. The more specific, the more universal — even people without kids understand dinner your family can't wait to sit down to. A specific picture is more persuasive than an abstract number because people can see it. If they can't picture it, it's not persuasive." },
          { topic: "Thoughts create feelings — listen for the sentence", type: "i", insight: "When listening to a prospect, you're listening for the specific thought they're currently holding — the sentence that's in the way. You can often tell by their body language too. Your job is to get them to think the next thought that makes them feel empowered. Not the final outcome — just the next thought. And you can't do that if you haven't asked and listened first." },
          { topic: "Launching pad, not finish line", type: "i", insight: "A common belief that blocks people from buying is this is where I solve my problem. You can't just tell them otherwise — they have to believe it. Your job is to get them to see the offer as a launching pad, not a finish line. But you can only do that by trading their current story for a better one they want to grab onto." },
        ]
      },
      {
        label: "One-to-One to One-to-Many",
        rows: [
          { topic: "One conversation builds your whole presentation", type: "i", insight: "Every individual conversation is market research for your one-to-many content. A dietitian kept getting the objection: there's so much free stuff on YouTube, why would I pay? She turned that single objection into daily podcasts, emails, and Instagram stories from every angle. The result: an $80,000 week. One conversation. Used everywhere." },
          { topic: "DMs are gold — use their exact words", type: "i", insight: "Every word someone says in a DM is exactly what you should be saying in your one-to-many content. Their exact language, their exact objection, their exact fear — use it verbatim. The closer your one-to-many mirrors the actual thought of one real person, the more your whole audience feels you're speaking directly to them." },
        ]
      },
      {
        label: "Handling Desperation and the Yips",
        rows: [
          { topic: "Desperation = misdirected focus", type: "m", insight: "Desperation in sales is the same as the yips in sports — pitchers throwing into the stands, penalty kickers missing a shot they've made a thousand times. It's not a disease. It's misdirected focus on the outcome instead of the process. The fix: get back to the skill. Back to the workhorse. Back to them." },
          { topic: "The skill carries you through chaos", type: "m", insight: "Macy's hardest year: house falling apart, 37 weeks pregnant, partner leaving unexpectedly, giving birth outside her own home — all at once. Not only did the business survive, it grew. The skill carries you. When you know how to focus on what someone gets, on meeting them where they are — your personal circumstances can't stop you." },
          { topic: "Don't watch the scoreboard", type: "i", insight: "When you're starting out: don't look at the numbers. Just sell every day for six months. Get into conversations, focus on the process, enjoy the game. The scoreboard takes care of itself when you stop watching it. When you start watching it, the yips start. Play the game, not the score." },
        ]
      },
      {
        label: "Congruence: How You Show Up",
        rows: [
          { topic: "Work with human nature, not against it", type: "m", insight: "People judge by appearance — that's human nature, not a flaw. Their eyes help them know what's safe and what to move toward. You can fight it and lose, or work with it. Color, energy, vitality — everything about how you physically show up either pulls people toward you or pushes them away. Choose to make it pull." },
          { topic: "Be a representation of what you sell", type: "i", insight: "If you sell transformation, look transformed. If you sell energy and vitality, look full of life. When Macy briefs her makeup artist, she says: I want to look as healthy, awake, fresh, and vibrant as I possibly can — like I just got back from the spa. Sales is bringing dead things to life. Be congruent with that at all times." },
          { topic: "Wardrobe is a hidden form of transformation", type: "i", insight: "Most people have clothes they put on when they feel bad — to stay in that feeling. People prefer a familiar hell to an unfamiliar heaven. Get rid of the clothes that represent the version of yourself you're done with. You eat differently, create differently, and show up differently based on how you're dressed. It's a secret weapon hiding in plain sight." },
          { topic: "Fresh beats easy", type: "i", insight: "Macy and her team don't try to keep things easy — they try to keep things fresh. Have a baseline: outfit that matches, shoes on, skincare done, a little lipstick. Not full glam — just enough to feel ready to act on inspiration when it hits. Because if you don't feel like you can show your face, you won't jump on camera. The moment's gone. Inspiration doesn't wait." },
          { topic: "Be ready for every opportunity", type: "m", insight: "There are opportunities everywhere — at the grocery store, in passing conversations, anywhere. But you can't see them if you're not ready for them. You're one conversation away from everything. The people at the top aren't more talented — they're the rare few willing to be ready, present, and precise every single time." },
        ]
      },

    guest: "Myron Golden & Miguel Carrasco",
    guestTitle: "Serial Entrepreneur & AI Consultant",
    preview: "AI is a multiplier, not a magic bullet. Multiply zero by any model and you still get zero. Myron Golden breaks down the 12 levels of human creativity AI can't replicate, the 7 levels of AI mastery, and the four levels of teaching that determine whether any knowledge actually changes someone.",
    tags: ["Mindset", "Ideas", "Warning"],

    sections: [
      {
        label: "The Core AI Mindset: Multiplication, Not Magic",
        rows: [
          { topic: "AI multiplies what you already are", type: "m", insight: "AI is not a magic bullet. It's a multiplier. If you multiply any number by zero, the result is zero — no matter how powerful the AI. If you multiply by one, you stay exactly where you are. The only way AI makes you more valuable is if you are already a number greater than one. Your job is to become worth multiplying first." },
          { topic: "AI increases productivity, not value", type: "m", insight: "AI doesn't add value to you — it increases the rate at which you can deliver the value you already have into the marketplace. The distinction matters: chasing AI tools without building underlying competence is a dead end. Build the human first, then use AI as the exponent." },
          { topic: "The model doesn't matter", type: "m", insight: "The release of a new model from Anthropic, OpenAI, Google, or DeepSeek changes nothing for most people. The model can only multiply what you already are. A more powerful multiplier applied to a zero is still zero. Stop waiting for the next model and start becoming someone worth multiplying." },
          { topic: "Humans using AI will outperform you", type: "w", insight: "AI is not going to take your job. Humans who learn to use AI effectively will. Companies who learn to use AI effectively will take your customers. This is not a technology story — it's a human evolution story. The same pattern played out with the web, social media, Facebook ads, and Bitcoin. You're at the crossroads now." },
          { topic: "AI is as bad as it will ever be today", type: "m", insight: "Every week it gets better, every month better still. The people who learn how to use it now, while most others are still dismissing or fearing it, are buying the equivalent of Bitcoin at 50 cents. In five years, the foundation will be table stakes. The compounding advantage belongs to those who start now." },
        ]
      },
      {
        label: "The Four Levels of Teaching (and Learning)",
        rows: [
          { topic: "Level 1: Tactics", type: "m", insight: "Tactics answer 'what do I do?' They are a trap for both teacher and student. People who don't get in shape aren't lacking tactics — eat less, move more is four words. People don't do what they know. Teaching only tactics produces students who leave knowing what to do and still don't do it." },
          { topic: "Level 2: Strategies", type: "m", insight: "Strategies add timing and motivation to tactics. But knowing what to do, when to do it, and why to do it still doesn't produce transformation. You can be strategically informed and behaviourally unchanged. Most coaching sits here and wonders why clients don't change." },
          { topic: "Level 3: Principles", type: "m", insight: "Principles are the laws that govern how something works. Teaching at this level means showing people how to do something, grounded in why it actually works that way. Students at this level have more success because they can adapt the method — not just follow instructions." },
          { topic: "Level 4: Essence", type: "m", insight: "The highest level of teaching is essence: teaching people how to become the kind of person who will naturally do the thing. This is identity-level change. Most transformation fails because it targets behaviour without touching identity. If you can teach at this level, people don't need willpower — the behaviour becomes natural to who they are." },
          { topic: "The best teachers hit all four levels", type: "i", insight: "The reason some teachers are impossible to stop listening to is they speak to all four levels simultaneously — no matter where you are in your journey, something lands. Applying this to AI: the better you operate at levels 3 and 4, the richer your prompts and the more you'll extract from any AI tool." },
        ]
      },
      {
        label: "Entrepreneurial Identity: The Foundation",
        rows: [
          { topic: "Be yourself in the marketplace", type: "m", insight: "The highest-performing version of your work comes from operating from your own unique identity. Michael Jackson never tried to be the Beatles. Beyonce is not trying to be Alicia Keys. The people you're meant to serve can only be served by the specific version of you that actually exists. Stop going to market trying to be someone else." },
          { topic: "Integrity: don't lie to get paid", type: "m", insight: "A life built on nothing to hide, nothing to prove, nothing to lose is powerful for a practical reason: you don't need a good memory. You said the same thing last time because you told the truth last time. Manipulation with falsehood never ends well — the compounding damage is always worse than the short-term gain." },
          { topic: "Good intentions as a default", type: "m", insight: "If you showed up as yourself, always told the truth, and genuinely intended to do people good — everything in your life would change. Not as a strategy, but as a way of being. The combination of authentic identity, integrity, and good intentions is the foundation beneath everything else." },
        ]
      },
      {
        label: "The 12 Levels of Human Creativity (What AI Cannot Replicate)",
        rows: [
          { topic: "AI cannot create — only amplify", type: "m", insight: "AI can amplify, multiply, and simplify what you create. It cannot create on its own because it has no experiences, no purpose, no intention, and no identity. The 12 levels of human creativity are precisely what AI cannot replicate — and the more of them you apply to your use of AI, the more valuable your output becomes." },
          { topic: "1. Intention", type: "i", insight: "Every creative act begins with intention — purpose and objective. Before you use AI for anything, know what you want to create, why you're creating it, and what outcome you want. Without this, you're handing a powerful tool to someone with nothing to say." },
          { topic: "1B. Disruption follows intention", type: "m", insight: "Every time you decide to do something good, something difficult shows up first. If you don't know this in advance, disruption will deceive you into thinking you're on the wrong track. You're not. Stop labelling difficulty as bad — you don't know if something is bad until the whole situation is fully played out." },
          { topic: "2. Inspiration", type: "m", insight: "After disruption follows intention, you need something that makes you feel like doing the thing anyway. Inspiration is what moves you to action despite the disruption. Different things inspire different people — find yours and use it deliberately rather than waiting for motivation to show up uninvited." },
          { topic: "3. Illumination", type: "i", insight: "Illumination is learning. Confusion is a form of darkness. Every truth you learn that's new to you provides more light than you had before. There should almost never be a day where you are not reading, listening, or learning something that serves your purpose." },
          { topic: "4. Identification", type: "i", insight: "When you have a breakthrough idea, give it a name — now it has a handle. Naming your frameworks and concepts is not branding fluff; it's how ideas become transmissible and how thinking becomes teachable." },
          { topic: "5. Separation / Distinction", type: "i", insight: "When you introduce a word or concept that has more than one meaning, you must create distinction. Everyone shares the same vocabulary but not the same dictionary. This is especially critical when prompting AI — a vague input produces a vague output. Define your terms precisely." },
          { topic: "6. Segmentation", type: "i", insight: "Never work on all phases of a project simultaneously. Work on one thing that produces profit until it's done, then move to the next. If you have seven deliverables and work on them all at once, you make no money until month seven. Ship sequentially: start earning in month one and have multiple revenue streams by month seven." },
          { topic: "7. Systemisation", type: "i", insight: "Build something once that you can push a button on and it runs from now on. YouTube is systemisation — you create a video once and it generates income indefinitely. The goal is to identify which activities can be converted into systems that keep working without repeating the work." },
          { topic: "8. Delegation", type: "i", insight: "Before AI, delegation could only go to humans. Now it can go to AI. But if you've never practised delegating to humans, you won't be good at delegating to AI — it's the same skill. A vague instruction to a human produces poor results. A vague prompt to Claude or ChatGPT produces the same." },
          { topic: "9. Automation", type: "i", insight: "Automation is when AI does something automatically based on a trigger — no repeated instruction needed. Key distinction: delegation is you telling it each time; automation is it running on its own. Example: AI that checks your email hourly, summarises it, drafts responses, and places them in your drafts folder — set once, runs forever." },
          { topic: "10. Culmination", type: "m", insight: "Culmination is the marquee creation — the big thing everything else was building toward. Once you have the nine prior levels in place, you have the foundation to create something genuinely significant. Everything prior was scaffolding for this." },
          { topic: "11 & 12. Recognition and Relaxation", type: "m", insight: "After culmination comes recognition — pausing to acknowledge what you've built. Then relaxation — intentional rest is part of the creative cycle, not a reward for finishing. Sustainable creativity requires recovery baked into the process, not bolted on after burnout." },
        ]
      },
      {
        label: "The Seven Levels of AI Mastery",
        rows: [
          { topic: "Level 1: Anticipation AI", type: "m", insight: "This is how AI actually works at its core — predicting the next word, just like autocorrect on your phone. Understanding this demystifies AI entirely. It's not magic; it's pattern prediction at scale. This changes how you think about prompting — you're not asking a brain, you're steering a prediction engine." },
          { topic: "Level 2: Asking and answering", type: "w", insight: "Where 90% of people are: using AI like a search engine. This level will not make you money in any meaningful way. Most people who say 'AI doesn't work for me' are operating here and have never gone deeper." },
          { topic: "Level 3: Automations", type: "i", insight: "Setting up AI to automatically do something without repeated instruction. This is where you start getting real time back. Triggered workflows that run without you is the point. This level makes you more efficient but is not yet a wealth-building level on its own." },
          { topic: "Level 4: AI Assets", type: "i", insight: "Using AI to build things you can sell — books, courses, music, content, tools. This is where income becomes possible. Critical caveat: if you skip the 12 levels of human creativity when building assets, you produce AI slop — content with no soul and no market. The creativity framework is what separates assets from noise." },
          { topic: "Level 5: Agentic AI", type: "i", insight: "You tell the AI the outcome you want, and based on how you've trained it, it figures out and executes the steps without you specifying each one. You're no longer giving instructions — you're giving objectives. The AI handles the path." },
          { topic: "Level 6: An arena of AI agents", type: "i", insight: "You own and control a garden of specialised AI agents working together on your behalf — running locally on your own machine, trained on your own frameworks and knowledge. Almost everything runs in this private system, not on public platforms. If your internet goes out, you can still talk to your AI." },
          { topic: "Level 7: Your own large language model", type: "i", insight: "The apex level: building your own LLM trained entirely on your knowledge, voice, and frameworks. Not using ChatGPT or Claude — being the model. This is a multi-year undertaking even for people with significant resources. Build the levels sequentially and only pursue this once you've mastered what's beneath it." },
          { topic: "Don't skip levels", type: "w", insight: "The temptation is to jump to level six or seven immediately. You'll end up bewildered and stuck. Each level builds the foundation for the next. Get the basics down on the level behind you, begin working on the level in front of you. That's how you progress without getting lost." },
        ]
      },
      {
        label: "Practical AI Setup: The Fundamentals",
        rows: [
          { topic: "Set up ChatGPT personalisation first", type: "i", insight: "Before using ChatGPT for anything substantive, go to Settings, then Personalisation, and configure your tone, style, and formatting preferences. Then enable Memory and tell it your name, occupation, and as much about yourself as possible. Most people have never done this and wonder why outputs feel generic. The tool performs to the context it's given." },
          { topic: "Use voice input (Whisper Flow)", type: "i", insight: "Install a voice-to-text tool like Whisper Flow to speak your prompts instead of typing. Three benefits: you give AI far more context (people type minimal words, they speak in full thoughts), you're faster, and everything is saved locally on your own machine — not locked inside a platform that could close your account. Your prompts are your intellectual property." },
          { topic: "Context is everything in prompting", type: "i", insight: "The quality of what you get back from AI is almost entirely determined by the richness of context you give it going in. A minimal prompt gets a minimal result — that is a law. Give AI your tone, your audience, your objective, your constraints, and your specific situation. The output ceiling is set by your input floor." },
          { topic: "Save your prompts locally", type: "w", insight: "If you build your entire prompt library inside ChatGPT or Claude and they close your account, you lose everything. Use a local voice-to-text tool that saves transcripts to your own device. Your prompts, your frameworks, your system instructions — these are assets. Store them somewhere you control." },
          { topic: "NotebookLM: learn anything in a weekend", type: "i", insight: "Go to notebooklm.google.com. Copy YouTube video links on any topic you want to master — add around 100 sources. NotebookLM watches all of them and builds a custom AI brain on that topic. You can then chat with it, generate mind maps, create flashcards, take quizzes, and listen to AI-generated podcast episodes. Zero to teachable on any subject in 48 hours." },
          { topic: "AI slop vs. humanity + AI", type: "w", insight: "AI slop is what you get when you give AI minimal input and expect brilliance in return. The world is filling up with it and audiences are developing an allergy fast. The antidote is always the same: put your full human creativity in first — your intention, your voice, your frameworks — then let AI amplify it." },
        ]
      },
      {
        label: "Business Thinking: Principles That Transcend AI",
        rows: [
          { topic: "Serve the greatest number of people", type: "m", insight: "The measure of greatness is the number of people you can serve value for. The more people you have the ability to help, the further up the ladder you go. Obsessing over solving other people's problems — not your own — is the entire game." },
          { topic: "Be interested, not interesting", type: "i", insight: "The way to be interesting is not to try to be interesting. The way to be interesting is to be genuinely interested in others. People who ask great questions are magnetic. The same applies to content: stop making the content you want to make and start obsessing over the problem your audience is living with." },
          { topic: "How can I afford it, not I can't", type: "m", insight: "When your transmission breaks, you figure out how to fix it. Things that don't change your life get solved. Things that could change your life get declined with 'I can't afford it.' The reframe: turn 'I can't afford this' into 'how can I afford this?' — the question forces your brain to find an answer instead of accepting a limit." },
          { topic: "Success mirrors itself across arenas", type: "m", insight: "Success in any arena mirrors success in every other arena because it's based on principles and patterns, not luck or timing. Timing without principles and patterns produces nothing. Your job is to understand principles deeply enough and recognise patterns reliably enough that when you apply human intelligence multiplied by artificial intelligence, the result is greater than one." },
        ]
