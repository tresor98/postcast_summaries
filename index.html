    id: "charles-duhigg",
    episode: "Ep. 011",
    date: "July 2025",
    title: "The 7 Day Habit Reset: Start Today, Feel Different by Next Week",
    guest: "Charles Duhigg",
    guestTitle: "Author of The Power of Habit",
    preview: "40-45% of what you do every day is a habit. Charles Duhigg breaks down the three-part loop behind every behaviour — and the three keystone habits that create a cascade of change across your entire life.",
    tags: ["Mindset", "Ideas", "Warning"],
    rowCount: 35,
    sections: [
      {
        label: "The Science of Habit",
        rows: [
          { topic: "What a habit actually is", type: "m", insight: "A habit is not a single thing. Every habit is made of three parts: a cue (a trigger), a routine (the behaviour itself), and a reward (the payoff your brain gets). The brain stores these as a loop — not a single action." },
          { topic: "How much of life is habit", type: "m", insight: "About 40–45% of what you do every day is a habit — including how you park, what you order for lunch, and how you react to your kids. You think you're making choices. Often you're not." },
          { topic: "Habits live in the basal ganglia", type: "m", insight: "The part of the brain that creates habits — the basal ganglia — exists in every animal. It is an energy-saving mechanism. When you're in a habit, your brain is actually thinking less, not more. It powers down to run the pattern automatically." },
          { topic: "Aristotle's framing", type: "m", insight: '"We are what we repeatedly do." Excellence is not an act — it\'s a habit. So is slacking off, procrastinating, and losing your temper. Every outcome in your life is the product of a pattern, not a character trait.' },
          { topic: "Habits shape identity, not talent", type: "m", insight: 'The research is clear: success is built on habits, not ability. The story you tell yourself about who you are — "I\'m not athletic, I\'m bad with money, I\'m a procrastinator" — is almost always a description of your habits, not your nature.' },
          { topic: "Any habit can be changed", type: "m", insight: "Because habits are loops with discoverable components, every single one can be modified. The mechanism is the same whether it's smoking, overeating, or procrastinating. Once you know how to break a habit into its parts, you can change any of them." },
        ]
      },
      {
        label: "Keystone Habits: The Hierarchy",
        rows: [
          { topic: "What a keystone habit is", type: "m", insight: "Some habits are more powerful than others. A keystone habit, when adopted, sets off a chain reaction that changes other unrelated behaviours — without you having to consciously target them. It creates a cascade effect through your life." },
          { topic: "Why the cascade works", type: "m", insight: "The mechanism is identity change. When you do a keystone habit, your brain begins building a new self-concept. That updated concept of who you are then quietly influences decisions all day — spending, eating, focus — without any extra effort." },
          { topic: "Stated vs actual preferences", type: "m", insight: "Your brain watches what you do, not what you say you'll do. The part of your brain that builds identity pays attention to actual behaviour, not intentions. Every time you act in line with who you want to be, your brain updates the model of who you are." },
        ]
      },
      {
        label: "Keystone Habit #1: Exercise",
        rows: [
          { topic: "Why exercise is the biggest lever", type: "i", insight: "Exercise is a keystone habit because it changes how you think about yourself. Research by Otin and Chang found that on days people exercise, they use credit cards less, procrastinate less at work, and do household tasks earlier — none of which are logically connected to a morning run." },
          { topic: "It doesn't have to be intense", type: "i", insight: "The keystone effect works even from standing up from your chair every 45 minutes. The form doesn't matter. What matters is that you start building an identity as someone who moves their body intentionally — that identity shift is what drives the cascade." },
          { topic: "Building the exercise habit loop", type: "i", insight: "Stack multiple cues: set an alarm (time of day), put your shoes next to the bed (environment cue), arrange to meet a friend (social cue). Any one cue is fragile. Three overlapping cues make the behaviour automatic faster. Then give yourself a real, savoured reward immediately after." },
          { topic: "The reward must be genuine", type: "w", insight: "A kale smoothie is not a reward if you don't enjoy it. If you punish yourself after exercising — even unintentionally, by rushing through your morning — your brain registers exercise as the cause of that punishment and will resist it the next day." },
          { topic: "Anticipating the reward", type: "m", insight: "Once the habit loop is established, the brain starts craving the reward the moment it sees the cue. You know the habit is locked in when you see your workout clothes and immediately start thinking about the latte waiting afterwards — not the exercise itself." },
        ]
      },
      {
        label: "Keystone Habit #2: Morning Routine",
        rows: [
          { topic: "Why a morning routine is keystone", type: "i", insight: "A morning routine determines how you feel about your day. How you feel shapes the decisions you make throughout it. A reactive, chaotic morning creates a reactive day. An intentional morning creates an intentional one — and the ripple compounds from there." },
          { topic: "The ARC framework", type: "i", insight: "Every effective morning routine has three elements: Anticipation (something to look forward to — even 30 seconds thinking about one thing you're excited about today), Relaxation (let your nervous system settle — a shower, tea, anything that slows you down), and Connection (contact with at least one person, pet, or yourself through reflection or prayer)." },
          { topic: "Why making your bed works", type: "i", insight: "Making your bed is not about the bed. It creates anticipation ('today will be good'), forces you to have enough time (requiring you to set the alarm earlier = planning), and often involves connection (doing something nice for a partner). The act is a delivery mechanism for ARC." },
          { topic: "Morning routine menu", type: "i", insight: "Any of these qualify if done with ARC intention: making your bed, eating breakfast (especially with others), organising a space, meditating, journalling, saying a prayer, walking a dog, calling a friend. What you do matters less than the three qualities you bring to it." },
          { topic: "The mistake: skipping the reward", type: "w", insight: "Most people complete their morning behaviour and rush straight to the next thing — never pausing to feel good about it. You must savor the reward. Pause for four seconds after making the bed and genuinely think: this looks great. That moment is what makes it a habit." },
          { topic: "Intentionality as the mechanism", type: "m", insight: "Research shows that people with morning routines make significantly better decisions about where to focus their attention throughout the day. They behave as proactive choosers, not reactive responders — and that deliberateness carries forward into everything else." },
        ]
      },
      {
        label: "Keystone Habit #3: Track Something",
        rows: [
          { topic: "Why tracking is a keystone habit", type: "i", insight: "When you're on autopilot — which is most of the day — you lose connection to the why behind your actions. Tracking is a small interruption that forces you to reconnect with your purpose. It doesn't need to be exhaustive or even complete. The act of pausing to record something is what matters." },
          { topic: "Tracking and weight loss", type: "i", insight: "The National Weight Loss Registry — the largest database of people who have lost weight — found that simply writing down what you eat is one of the two most powerful predictors of sustained weight loss. It works because it reveals invisible patterns and reminds you of your purpose, not because the data itself is magic." },
          { topic: "The 'why' stays visible", type: "m", insight: "A professor who hated grading papers told himself: 'By grading this paper, I am funding the lab that will cure cancer.' As soon as he connected the act to his purpose, it became easier. Tracking does the same — every time you note something down, you're quietly reminding yourself why it matters." },
          { topic: "What to track", type: "i", insight: "Track one thing you wish you did more or less of. Water intake. Bedtime. Spending. Steps. It doesn't matter what. Even a 15-minute weekly spending review changes how you behave the other 10,000+ minutes of the week. The point is the pause, not the data." },
          { topic: "Tracking reveals invisible patterns", type: "i", insight: "You can't fix what you can't see. Tracking makes visible the patterns that run on autopilot — people realise they've been eating the same bad breakfast five times a week, or find subscriptions they forgot existed two years ago. The data is the diagnosis." },
        ]
      },
      {
        label: "The Mechanics of Change",
        rows: [
          { topic: "Hot mind vs cold mind", type: "m", insight: "Your brain hates making decisions in the moment (hot mind state). The fix: make the decision before you need to. Decide tonight what exercise class you're doing tomorrow. Lay out your clothes. Choose your route. When the tired, overwhelmed morning version of you wakes up, the decision is already made." },
          { topic: "Implementation intentions", type: "i", insight: 'The research term for "if X then Y" pre-planning. From a calm, cold state: "Tomorrow morning, when I see my alarm and my workout clothes on the floor, I will do the class I already queued up." This kind of pre-commitment dramatically increases follow-through because no decision-making is required in the moment.' },

//  RENDER GRID

const tagLabels = { Mindset: "Mindset", Ideas: "Ideas", Warning: "Warnings" };
const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  if (SUMMARIES.length === 0) {
    grid.innerHTML = '<div class="empty">No summaries yet — add some to the <code>SUMMARIES</code> array.</div>';
    return;
  }
  SUMMARIES.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open summary: ${s.title}`);

    const tagHTML = s.tags.map(t => {
      const cls = t === 'Mindset' ? 'pill-m' : t === 'Ideas' ? 'pill-i' : 'pill-w';
      return `<span class="pill ${cls}">${t}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-meta">
        <span class="card-ep">${s.episode}</span>
        <span class="card-date">${s.date}</span>
      </div>
      <h2>${s.title}</h2>
      <div class="card-guest">with <strong>${s.guest}</strong> · ${s.guestTitle}</div>
      <div class="card-tags">${tagHTML}</div>
      <p class="card-preview">${s.preview}</p>
      <div class="card-footer">
        <span class="card-count">${s.rowCount} key points</span>
        <span class="card-arrow">→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(s));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(s); });
    grid.appendChild(card);
  });
}

//  MODAL
// ══════════════════════════════════════════════
const overlay = document.getElementById('overlay');
const modalEp = document.getElementById('modal-ep');
const modalTitle = document.getElementById('modal-title-el');
const modalGuest = document.getElementById('modal-guest');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close-btn');

function typeClass(t) {
  return t === 'm' ? 'pill-m' : t === 'i' ? 'pill-i' : 'pill-w';
}
function typeLabel(t) {
  return t === 'm' ? 'Mindset' : t === 'i' ? 'Idea' : 'Warning';
}

function openModal(s) {
  modalEp.textContent = s.episode;
  modalTitle.textContent = s.title;
  modalGuest.innerHTML = `<strong>${s.guest}</strong> · ${s.guestTitle}`;

  let bodyHTML = `
    <div class="legend">
      <span class="legend-item"><span class="pill pill-m">Mindset</span> Mental models & philosophy</span>
      <span class="legend-item"><span class="pill pill-i">Idea</span> Actionable business ideas</span>
      <span class="legend-item"><span class="pill pill-w">Warning</span> Mistakes & things to avoid</span>
    </div>
  `;

  s.sections.forEach(sec => {
    bodyHTML += `<div class="summary-section">`;
    bodyHTML += `<div class="section-label">${sec.label}</div>`;
    sec.rows.forEach(row => {
      bodyHTML += `
        <div class="summary-row">
          <div class="row-topic">${row.topic}</div>
          <div class="row-type"><span class="pill ${typeClass(row.type)}">${typeLabel(row.type)}</span></div>
          <div class="row-insight">${row.insight}</div>
        </div>
      `;
    });
    bodyHTML += `</div>`;
  });

  modalBody.innerHTML = bodyHTML;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ══════════════════════════════════════════════

renderGrid();
