      {
        label: "The 12 Levels of Human Creativity (What AI Cannot Replicate)",
        rows: [
          { topic: "AI cannot create — only amplify", type: "m", insight: "AI can amplify, multiply, and simplify what you create. It cannot create on its own because it has no experiences, no purpose, no intention, and no identity. The 12 levels of human creativity are precisely what AI cannot replicate — and the more of them you apply to your use of AI, the more valuable your output becomes." },
          { topic: "1. Intention", type: "i", insight: "Every creative act begins with intention — purpose and objective. Before you use AI for anything, know what you want to create, why you're creating it, and what outcome you want. Without this, you're handing a powerful tool to someone with nothing to say." },
          { topic: "1B. Disruption follows intention", type: "m", insight: "Every time you decide to do something good, something difficult shows up first. If you don't know this in advance, disruption will deceive you into thinking you're on the wrong track. You're not. Stop labelling difficulty as bad — you don't know if something is bad until the whole situation is fully played out." },
          { topic: "2. Inspiration", type: "m", insight: "After disruption follows intention, you need something that makes you feel like doing the thing anyway. Inspiration is what moves you to action despite the disruption. Different things inspire different people — find yours and use it deliberately rather than waiting for motivation to show up uninvited." },
          { topic: "3. Illumination", type: "i", insight: "Illumination is learning. Confusion is a form of darkness. Every truth you learn that's new to you provides more light than you had before. There should almost never be a day where you are not reading, listening, or learning something that serves your purpose." },
          { topic: "4. Identification", type: "i", insight: "When you have a breakthrough idea, give it a name — now it has a handle. Naming your frameworks and concepts is not branding fluff; it's how ideas become transmissible and how thinking becomes teachable." },
          { topic: "5. Separation / Distinction", type: "i", insight: "When you introduce a word or concept that has more than one meaning, you must create distinction. Everyone shares the same vocabulary but not the same dictionary. This is especially critical when prompting AI — a vague input produces a vague output. Define your terms precisely." },
          { topic: "6. Segmentation", type: "i", insight: "Never work on all phases of a project simultaneously. Work on one thing that produces profit until it's done, then move to the next. If you have seven deliverables and work on them all at once, you make no money until month seven. Ship sequentially: start earning in month one and have multiple revenue streams by month seven." },
          { topic: "7. Systemisation", type: "i", insight: "Build something once that you can push a button on and it runs from now on. YouTube is systemisation — you create a video once and it generates income indefinitely. The goal is to identify which activities can be converted into systems that keep working without repeating the work." },
          { topic: "8. Delegation", type: "i", insight: "Before AI, delegation could only go to humans. Now it can go to AI. But if you've never practised delegating to humans, you won't be good at delegating to AI — it's the same skill. A vague instruction to a human produces poor results. A vague prompt to Claude or ChatGPT produces the same." },
          { topic: "9. Automation", type: "i", insight: "Automation is when AI does something automatically based on a trigger — no repeated instruction needed. Key distinction: delegation is you telling it each time; automation is it running on its own. Example: AI that checks your email hourly, summarises it, drafts responses, and places them in your drafts folder — set once, runs forever." },
          { topic: "10. Culmination", type: "m", insight: "Culmination is the marquee creation — the big thing everything else was building toward. Once you have the nine prior levels in place, you have the foundation to create something genuinely significant. Everything prior was scaffolding for this." },
          { topic: "11 & 12. Recognition and Relaxation", type: "m", insight: "After culmination comes recognition — pausing to acknowledge what you've built. Then relaxation — intentional rest is part of the creative cycle, not a reward for finishing. Sustainable creativity requires recovery baked into the process, not bolted on after burnout." },

          { topic: "Level 3: Automations", type: "i", insight: "Setting up AI to automatically do something without repeated instruction. This is where you start getting real time back. Triggered workflows that run without you is the point. This level makes you more efficient but is not yet a wealth-building level on its own." },

          { topic: "Level 5: Agentic AI", type: "i", insight: "You tell the AI the outcome you want, and based on how you've trained it, it figures out and executes the steps without you specifying each one. You're no longer giving instructions — you're giving objectives. The AI handles the path." },

          { topic: "Use voice input (Whisper Flow)", type: "i", insight: "Install a voice-to-text tool like Whisper Flow to speak your prompts instead of typing. Three benefits: you give AI far more context (people type minimal words, they speak in full thoughts), you're faster, and everything is saved locally on your own machine — not locked inside a platform that could close your account. Your prompts are your intellectual property." },
          { topic: "Context is everything in prompting", type: "i", insight: "The quality of what you get back from AI is almost entirely determined by the richness of context you give it going in. A minimal prompt gets a minimal result — that is a law. Give AI your tone, your audience, your objective, your constraints, and your specific situation. The output ceiling is set by your input floor." },
          { topic: "Save your prompts locally", type: "w", insight: "If you build your entire prompt library inside ChatGPT or Claude and they close your account, you lose everything. Use a local voice-to-text tool that saves transcripts to your own device. Your prompts, your frameworks, your system instructions — these are assets. Store them somewhere you control." },
          { topic: "NotebookLM: learn anything in a weekend", type: "i", insight: "Go to notebooklm.google.com. Copy YouTube video links on any topic you want to master — add around 100 sources. NotebookLM watches all of them and builds a custom AI brain on that topic. You can then chat with it, generate mind maps, create flashcards, take quizzes, and listen to AI-generated podcast episodes. Zero to teachable on any subject in 48 hours." },

          { topic: "Be interested, not interesting", type: "i", insight: "The way to be interesting is not to try to be interesting. The way to be interesting is to be genuinely interested in others. People who ask great questions are magnetic. The same applies to content: stop making the content you want to make and start obsessing over the problem your audience is living with." },

      {
        label: "The Science of Habit",
        rows: [
          { topic: "What a habit actually is", type: "m", insight: "A habit is not a single thing. Every habit is made of three parts: a cue (a trigger), a routine (the behaviour itself), and a reward (the payoff your brain gets). The brain stores these as a loop — not a single action." },
          { topic: "How much of life is habit", type: "m", insight: "About 40–45% of what you do every day is a habit — including how you park, what you order for lunch, and how you react to your kids. You think you're making choices. Often you're not." },
          { topic: "Habits live in the basal ganglia", type: "m", insight: "The part of the brain that creates habits — the basal ganglia — exists in every animal. It is an energy-saving mechanism. When you're in a habit, your brain is actually thinking less, not more. It powers down to run the pattern automatically." },
          { topic: "Aristotle's framing", type: "m", insight: '"We are what we repeatedly do." Excellence is not an act — it\'s a habit. So is slacking off, procrastinating, and losing your temper. Every outcome in your life is the product of a pattern, not a character trait.' },
          { topic: "Habits shape identity, not talent", type: "m", insight: 'The research is clear: success is built on habits, not ability. The story you tell yourself about who you are — "I\'m not athletic, I\'m bad with money, I\'m a procrastinator" — is almost always a description of your habits, not your nature.' },
          { topic: "Any habit can be changed", type: "m", insight: "Because habits are loops with discoverable components, every single one can be modified. The mechanism is the same whether it's smoking, overeating, or procrastinating. Once you know how to break a habit into its parts, you can change any of them." },

      {

          { topic: "What a keystone habit is", type: "m", insight: "Some habits are more powerful than others. A keystone habit, when adopted, sets off a chain reaction that changes other unrelated behaviours — without you having to consciously target them. It creates a cascade effect through your life." },
          { topic: "Why the cascade works", type: "m", insight: "The mechanism is identity change. When you do a keystone habit, your brain begins building a new self-concept. That updated concept of who you are then quietly influences decisions all day — spending, eating, focus — without any extra effort." },
          { topic: "Stated vs actual preferences", type: "m", insight: "Your brain watches what you do, not what you say you'll do. The part of your brain that builds identity pays attention to actual behaviour, not intentions. Every time you act in line with who you want to be, your brain updates the model of who you are." },

      {

          { topic: "It doesn't have to be intense", type: "i", insight: "The keystone effect works even from standing up from your chair every 45 minutes. The form doesn't matter. What matters is that you start building an identity as someone who moves their body intentionally — that identity shift is what drives the cascade." },
          { topic: "Building the exercise habit loop", type: "i", insight: "Stack multiple cues: set an alarm (time of day), put your shoes next to the bed (environment cue), arrange to meet a friend (social cue). Any one cue is fragile. Three overlapping cues make the behaviour automatic faster. Then give yourself a real, savoured reward immediately after." },
          { topic: "The reward must be genuine", type: "w", insight: "A kale smoothie is not a reward if you don't enjoy it. If you punish yourself after exercising — even unintentionally, by rushing through your morning — your brain registers exercise as the cause of that punishment and will resist it the next day." },
          { topic: "Anticipating the reward", type: "m", insight: "Once the habit loop is established, the brain starts craving the reward the moment it sees the cue. You know the habit is locked in when you see your workout clothes and immediately start thinking about the latte waiting afterwards — not the exercise itself." },

      {

          { topic: "The ARC framework", type: "i", insight: "Every effective morning routine has three elements: Anticipation (something to look forward to — even 30 seconds thinking about one thing you're excited about today), Relaxation (let your nervous system settle — a shower, tea, anything that slows you down), and Connection (contact with at least one person, pet, or yourself through reflection or prayer)." },
          { topic: "Why making your bed works", type: "i", insight: "Making your bed is not about the bed. It creates anticipation ('today will be good'), forces you to have enough time (requiring you to set the alarm earlier = planning), and often involves connection (doing something nice for a partner). The act is a delivery mechanism for ARC." },
          { topic: "Morning routine menu", type: "i", insight: "Any of these qualify if done with ARC intention: making your bed, eating breakfast (especially with others), organising a space, meditating, journalling, saying a prayer, walking a dog, calling a friend. What you do matters less than the three qualities you bring to it." },
          { topic: "The mistake: skipping the reward", type: "w", insight: "Most people complete their morning behaviour and rush straight to the next thing — never pausing to feel good about it. You must savor the reward. Pause for four seconds after making the bed and genuinely think: this looks great. That moment is what makes it a habit." },
          { topic: "Intentionality as the mechanism", type: "m", insight: "Research shows that people with morning routines make significantly better decisions about where to focus their attention throughout the day. They behave as proactive choosers, not reactive responders — and that deliberateness carries forward into everything else." },

      {

        rows: [
          { topic: "Why tracking is a keystone habit", type: "i", insight: "When you're on autopilot — which is most of the day — you lose connection to the why behind your actions. Tracking is a small interruption that forces you to reconnect with your purpose. It doesn't need to be exhaustive or even complete. The act of pausing to record something is what matters." },
          { topic: "Tracking and weight loss", type: "i", insight: "The National Weight Loss Registry — the largest database of people who have lost weight — found that simply writing down what you eat is one of the two most powerful predictors of sustained weight loss. It works because it reveals invisible patterns and reminds you of your purpose, not because the data itself is magic." },
          { topic: "The 'why' stays visible", type: "m", insight: "A professor who hated grading papers told himself: 'By grading this paper, I am funding the lab that will cure cancer.' As soon as he connected the act to his purpose, it became easier. Tracking does the same — every time you note something down, you're quietly reminding yourself why it matters." },
          { topic: "What to track", type: "i", insight: "Track one thing you wish you did more or less of. Water intake. Bedtime. Spending. Steps. It doesn't matter what. Even a 15-minute weekly spending review changes how you behave the other 10,000+ minutes of the week. The point is the pause, not the data." },
          { topic: "Tracking reveals invisible patterns", type: "i", insight: "You can't fix what you can't see. Tracking makes visible the patterns that run on autopilot — people realise they've been eating the same bad breakfast five times a week, or find subscriptions they forgot existed two years ago. The data is the diagnosis." },

      {

          { topic: "Implementation intentions", type: "i", insight: 'The research term for "if X then Y" pre-planning. From a calm, cold state: "Tomorrow morning, when I see my alarm and my workout clothes on the floor, I will do the class I already queued up." This kind of pre-commitment dramatically increases follow-through because no decision-making is required in the moment.' },
          { topic: "Write out the loop on paper", type: "i", insight: "When building any new habit, take 20 seconds to write three columns: cue / routine / reward. What specific cue will trigger this? What exactly will the behaviour be? What reward will I give myself immediately after — and will I actually pause to enjoy it?" },
          { topic: "Remove friction from the routine", type: "i", insight: "The guitar left in a case upstairs never gets played. The guitar on a stand next to your chair gets played. Every unnecessary step between you and the behaviour is a chance for your brain to say 'not today.' Reduce friction to near zero: shoes by the bed, journal on the nightstand, water bottle already filled." },
          { topic: "Savor the reward — don't rush past it", type: "w", insight: "The reward is not just what makes the experience pleasant. It's what tells your brain the loop is complete and worth repeating. If you complete the behaviour and immediately move to the next thing, your brain gets no signal. Pause. Look at the made bed. Taste the latte. Let yourself feel good. That is the moment that locks the habit in." },

      {

          { topic: "Don't try to break a habit", type: "m", insight: '"Breaking" a habit doesn\'t work because the cue and the craving for the reward don\'t go away — you\'ve just removed the behaviour that satisfied them. They\'ll find another outlet, usually worse. Willpower alone almost never wins this fight long-term.' },
          { topic: "The golden rule of habit change", type: "i", insight: "Keep the cue. Keep the reward. Change only the routine. Diagnose what triggers the habit and what reward it's actually delivering — not the surface-level reward, but the real underlying one. Then find a new behaviour that responds to the same cue and delivers the same core reward." },

//  RENDER GRID
// ══════════════════════════════════════════════
const tagLabels = { Mindset: "Mindset", Ideas: "Ideas", Warning: "Warnings" };
const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  if (SUMMARIES.length === 0) {
    grid.innerHTML = '<div class="empty">No summaries yet — add some to the <code>SUMMARIES</code> array.</div>';
    return;
  }
  SUMMARIES.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open summary: ${s.title}`);

    const tagHTML = s.tags.map(t => {
      const cls = t === 'Mindset' ? 'pill-m' : t === 'Ideas' ? 'pill-i' : 'pill-w';
      return `<span class="pill ${cls}">${t}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-meta">
        <span class="card-ep">${s.episode}</span>
        <span class="card-date">${s.date}</span>
      </div>
      <h2>${s.title}</h2>
      <div class="card-guest">with <strong>${s.guest}</strong> · ${s.guestTitle}</div>
      <div class="card-tags">${tagHTML}</div>
      <p class="card-preview">${s.preview}</p>
      <div class="card-footer">
        <span class="card-count">${s.rowCount} key points</span>
        <span class="card-arrow">→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(s));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(s); });
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════
const overlay = document.getElementById('overlay');
const modalEp = document.getElementById('modal-ep');
const modalTitle = document.getElementById('modal-title-el');
const modalGuest = document.getElementById('modal-guest');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close-btn');

function typeClass(t) {
  return t === 'm' ? 'pill-m' : t === 'i' ? 'pill-i' : 'pill-w';
}
function typeLabel(t) {
  return t === 'm' ? 'Mindset' : t === 'i' ? 'Idea' : 'Warning';
}

function openModal(s) {
  modalEp.textContent = s.episode;
  modalTitle.textContent = s.title;
  modalGuest.innerHTML = `<strong>${s.guest}</strong> · ${s.guestTitle}`;

  let bodyHTML = `
    <div class="legend">
      <span class="legend-item"><span class="pill pill-m">Mindset</span> Mental models & philosophy</span>
      <span class="legend-item"><span class="pill pill-i">Idea</span> Actionable business ideas</span>
      <span class="legend-item"><span class="pill pill-w">Warning</span> Mistakes & things to avoid</span>
    </div>
  `;

  s.sections.forEach(sec => {
    bodyHTML += `<div class="summary-section">`;
    bodyHTML += `<div class="section-label">${sec.label}</div>`;
    sec.rows.forEach(row => {
      bodyHTML += `
        <div class="summary-row">
          <div class="row-topic">${row.topic}</div>
          <div class="row-type"><span class="pill ${typeClass(row.type)}">${typeLabel(row.type)}</span></div>
          <div class="row-insight">${row.insight}</div>
        </div>
      `;
    });
    bodyHTML += `</div>`;
  });

  modalBody.innerHTML = bodyHTML;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
renderGrid();
</script>
